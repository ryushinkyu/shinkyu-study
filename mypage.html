<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>マイページ</title>

<link rel="stylesheet" href="style.css">

<style>

.profileCard{
margin-top:15px;
padding:20px;
background:#f9f9f9;
border-radius:12px;
line-height:2;
}

.label{
font-weight:bold;
color:#555;
}

.streakBox{
margin-top:20px;
padding:15px;
border-radius:12px;
background:#fff3e0;
font-size:20px;
font-weight:bold;
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>マイページ</h1>

<div id="profile"></div>

<button
style="margin-top:20px;"
onclick="location.href='home.html'"
>

ホーム

</button>

</div>

</div>

<script>

// ========================================
// ログイン確認
// ========================================

const currentUser = localStorage.getItem("currentUser");

if(!currentUser){

location.href = "index.html";

}


// ========================================
// Firebase
// ========================================

const firebaseConfig = {
  apiKey: "AIzaSyCP1hLNtyZAsrWg27puxdgOdHz6ZAHt4EM",
  authDomain: "shinkyu-study.firebaseapp.com",
  projectId: "shinkyu-study"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


// ========================================
// ユーザー情報取得
// ========================================

db.collection("users").doc(currentUser).get()
.then(doc => {

if(!doc.exists){

document.getElementById("profile").innerHTML = `
<p>
ユーザー情報が見つかりません
</p>
`;

return;

}

const user = doc.data();


// ========================================
// 連続学習日数
// ========================================

let streak = Number(
localStorage.getItem("studyStreak") || "0"
);


// ========================================
// 表示
// ========================================

let html = `

<div class="profileCard">

<p>

<span class="label">

👤 名前：

</span>

${user.fullname}

</p>

<p>

<span class="label">

📛 ユーザー名：

</span>

${user.username}

</p>

<p>

<span class="label">

🎓 学年：

</span>

${user.grade}

</p>

<p>

<span class="label">

🆔 会員番号：

</span>

${user.memberId}

</p>

</div>

<div class="streakBox">

🔥 連続学習日数

<br><br>

${streak} 日

</div>

`;

document.getElementById("profile").innerHTML = html;

});

</script>

</body>
</html>
