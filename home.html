
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鍼灸Study - ホーム</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .menuTitle {
      margin-bottom: 16px;
      text-align: center;
    }

    /* ボタンを2列に配置 */
    .menuGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .menuGrid button {
      width: 100%;
      min-height: 64px;
      margin: 0;
      padding: 12px 6px;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      background: #2196f3;
      color: white;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .menuGrid button:active {
      transform: scale(0.98);
    }

    .menuGrid .logoutBtn {
      background: #777;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">

      <h2 class="menuTitle">ホーム画面</h2>
      <p id="welcomeMsg"></p>

      <div class="menuGrid">

        <button onclick="location.href='mypage.html'">
          👤 マイページ
        </button>

        <button onclick="location.href='lectureMenu.html'">
          📝 講義
        </button>

        <button onclick="location.href='quizMenu.html'">
          📚 クイズ
        </button>

        <button onclick="location.href='review.html'">
          🔁 復習リスト
        </button>

        <button onclick="location.href='oneQuestionMenu.html'">
          🧠 一問一答
        </button>

        <button onclick="location.href='search.html'">
          🔍 AI検索
        </button>

        <button
          id="rankBtn"
          style="display: none;"
          onclick="location.href='ranking.html'"
        >
          🏆 ランキング
        </button>

        <button
          id="adminBtn"
          style="display: none;"
          onclick="location.href='admin.html'"
        >
          ⚙️ 管理
        </button>

        <button class="logoutBtn" onclick="logout()">
          ログアウト
        </button>

      </div>
    </div>
  </div>

  <script>
    const currentUser = localStorage.getItem("currentUser");

    // ログインチェック
    if (!currentUser) {
      location.href = "index.html";
    } else {
      document.getElementById("welcomeMsg").textContent =
        "ようこそ、" + currentUser + " さん！";
    }

    // 日付リセット
    const today = new Date().toDateString();
    const last = localStorage.getItem("lastDate");

    if (today !== last) {
      localStorage.setItem("dailyCleared", "false");
      localStorage.setItem("lastDate", today);
    }

    // 管理者の設定
    if (currentUser === "admin") {
      document.getElementById("adminBtn").style.display = "block";
      document.getElementById("rankBtn").style.display = "block";
    }

    // ランキング表示
    if (localStorage.getItem("dailyCleared") === "true") {
      document.getElementById("rankBtn").style.display = "block";
    }

    // ログアウト
    function logout() {
      localStorage.removeItem("currentUser");
      location.href = "index.html";
    }
  </script>
</body>
</html>
