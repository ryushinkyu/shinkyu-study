
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鍼灸Study - AI検索</title>
<link rel="stylesheet" href="style.css">

<style>
body {
    background: #f4f7fb;
}

.search-card {
    max-width: 760px;
    margin: 24px auto;
    padding: 22px;
}

.search-description {
    color: #64748b;
    line-height: 1.8;
}

.search-form {
    display: flex;
    gap: 8px;
    margin-top: 20px;
}

#searchInput {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    cursor: pointer;
}

.search-button {
    width: auto;
    min-width: 90px;
    padding: 12px 18px;
    background: #087f8c;
}

.search-button:disabled {
    opacity: .6;
    cursor: wait;
}

.status {
    margin-top: 18px;
    color: #64748b;
    line-height: 1.7;
}

.answer-card,
.local-card {
    margin-top: 18px;
    padding: 18px;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    line-height: 1.9;
    overflow-wrap: anywhere;
}

.answer-card h2,
.local-card h3 {
    margin-top: 0;
}

.answer-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.95;
}

.ai-label {
    color: #087f8c;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
}

.local-label {
    color: #64748b;
    font-size: 13px;
    font-weight: bold;
}

.error-message {
    margin-top: 15px;
    padding: 14px;
    color: #9f1239;
    background: #fff1f2;
    border-radius: 8px;
    line-height: 1.8;
}

.local-item {
    padding: 12px 0;
    border-top: 1px solid #e2e8f0;
}

.local-item:first-of-type {
    border-top: none;
}

.local-item h4 {
    margin: 0 0 8px;
}

.local-item p {
    margin: 6px 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.secondary-button {
    margin-top: 20px;
    background: #64748b;
}

@media (max-width: 480px) {
    .search-card {
        margin: 10px;
        padding: 16px;
    }

    .search-form {
        flex-direction: column;
    }

    .search-button {
        width: 100%;
    }
}
</style>
</head>

<body>
<div class="container">
    <div class="card search-card">
        <h1>🔍 鍼灸Study AI検索</h1>

        <p class="search-description">
            鍼灸・医学・国家試験の用語を検索できます。<br>
            辞書に登録されていない言葉もAIに質問できます。
        </p>

        <form id="searchForm" class="search-form">
            <input
                id="searchInput"
                type="text"
                maxlength="500"
                placeholder="例：プライマリ・ヘルス・ケア"
                autocomplete="off"
                required
            >
            <button id="searchButton" class="search-button" type="submit">
                AI検索
            </button>
        </form>

        <p class="search-description">
            例：ブラウン・セカール症候群、肝兪の取穴、交感神経、
            アルマ・アタ宣言
        </p>

        <div id="status" class="status" aria-live="polite"></div>
        <div id="aiResult"></div>
        <div id="localResult"></div>

        <button
            type="button"
            class="secondary-button"
            onclick="location.href='home.html'"
        >
            ホームへ戻る
        </button>
    </div>
</div>

<!-- 既存の辞書データ。ファイルがなくてもAI検索は利用可能 -->
<script src="searchData.js"></script>

<script>
const form = document.getElementById("searchForm");
const input = document.getElementById("searchInput");
const searchButton = document.getElementById("searchButton");
const statusBox = document.getElementById("status");
const aiResult = document.getElementById("aiResult");
const localResult = document.getElementById("localResult");

function normalizeText(value) {
    return String(value ?? "")
        .normalize("NFKC")
        .toLowerCase()
        .replace(/[\s　・･\-‐‑‒–—―_.,，。:：;；/／\\()（）［］\[\]「」『』【】]/g, "");
}

function getDictionary() {
    try {
        if (
            typeof dictionary !== "undefined" &&
            dictionary &&
            typeof dictionary === "object"
        ) {
            return dictionary;
        }
    } catch (error) {
        console.warn("辞書の読み込みを確認してください。", error);
    }

    return {};
}

function getLocalMatches(query) {
    const data = getDictionary();
    const normalizedQuery = normalizeText(query);

    if (!normalizedQuery) return [];

    const matches = [];

    for (const [key, value] of Object.entries(data)) {
        let searchableText = "";

        try {
            searchableText = normalizeText(
                key + " " + JSON.stringify(value)
            );
        } catch (error) {
            searchableText = normalizeText(key);
        }

        if (
            searchableText.includes(normalizedQuery) ||
            normalizedQuery.includes(normalizeText(key))
        ) {
            matches.push({ key, value });
        }
    }

    return matches.slice(0, 5);
}

function addText(parent, tag, text, className) {
    const element = document.createElement(tag);
    element.textContent = text ?? "";

    if (className) element.className = className;

    parent.appendChild(element);
    return element;
}

function showLocalMatches(matches) {
    localResult.replaceChildren();

    if (matches.length === 0) return;

    const card = document.createElement("section");
    card.className = "local-card";

    addText(card, "h3", "📚 登録済み辞書の一致");
    addText(
        card,
        "p",
        matches.length + "件の辞書項目が見つかりました。",
        "local-label"
    );

    for (const item of matches) {
        const section = document.createElement("div");
        section.className = "local-item";

        addText(section, "h4", item.key);

        if (typeof item.value === "string") {
            addText(section, "p", item.value);
        } else if (
            item.value &&
            typeof item.value === "object"
        ) {
            const fields = [
                ["meaning", "意味"],
                ["point", "国家試験ポイント"],
                ["memory", "覚え方"],
                ["related", "関連キーワード"],
                ["chapter", "関連章"]
            ];

            let displayed = false;

            for (const [field, label] of fields) {
                if (item.value[field]) {
                    addText(
                        section,
                        "p",
                        label + "：" + item.value[field]
                    );
                    displayed = true;
                }
            }

            if (!displayed) {
                addText(
                    section,
                    "p",
                    JSON.stringify(item.value, null, 2)
                );
            }
        }

        card.appendChild(section);
    }

    localResult.appendChild(card);
}

function showAIAnswer(answer) {
    aiResult.replaceChildren();

    const card = document.createElement("section");
    card.className = "answer-card";

    addText(card, "div", "AIによる解説", "ai-label");
    addText(card, "h2", "検索結果");

    const answerText = addText(
        card,
        "div",
        answer,
        "answer-text"
    );

    aiResult.appendChild(card);
}

function showError(message) {
    const box = document.createElement("div");
    box.className = "error-message";
    box.textContent = message;
    aiResult.appendChild(box);
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const query = input.value.trim();

    if (!query) {
        statusBox.textContent = "検索する言葉を入力してください。";
        return;
    }

    if (query.length > 500) {
        statusBox.textContent = "検索語は500文字以内にしてください。";
        return;
    }

    aiResult.replaceChildren();
    localResult.replaceChildren();

    const localMatches = getLocalMatches(query);
    showLocalMatches(localMatches);

    // AIに渡す辞書情報は、見つかった項目だけに限定
    const dictionaryContext = localMatches
        .map(item => {
            return item.key + "\n" +
                JSON.stringify(item.value, null, 2);
        })
        .join("\n\n")
        .slice(0, 5000);

    searchButton.disabled = true;
    searchButton.textContent = "検索中...";
    statusBox.textContent = "AIが解説を作成しています。少し待ってね。";

    try {
        const response = await fetch("/api/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: query,
                dictionaryContext: dictionaryContext
            })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                result.error ||
                "AIへの接続に失敗しました。サーバーの設定を確認してください。"
            );
        }

        if (!result.answer) {
            throw new Error("AIから回答を取得できませんでした。");
        }

        showAIAnswer(result.answer);
        statusBox.textContent = "検索が完了しました。";

    } catch (error) {
        console.error(error);

        statusBox.textContent = "AI検索を完了できませんでした。";

        showError(
            error.message ||
            "接続に失敗しました。server.py が起動しているか確認してください。"
        );

    } finally {
        searchButton.disabled = false;
        searchButton.textContent = "AI検索";
    }
});

input.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        input.value = "";
        aiResult.replaceChildren();
        localResult.replaceChildren();
        statusBox.textContent = "";
    }
});
</script>
</body>
</html>
