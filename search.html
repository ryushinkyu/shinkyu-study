<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI検索</title>

<link rel="stylesheet" href="style.css">

<style>

.resultBox{
margin-top:20px;
padding:15px;
background:#f9f9f9;
border-radius:10px;
line-height:1.8;
text-align:left;
}

.keyword{
font-size:24px;
font-weight:bold;
color:#0288d1;
margin-bottom:10px;
}

.point{
margin-top:15px;
padding:12px;
background:#fff3cd;
border-radius:10px;
}

.memory{
margin-top:15px;
padding:12px;
background:#d1ecf1;
border-radius:10px;
}

.related{
margin-top:15px;
padding:12px;
background:#d4edda;
border-radius:10px;
}

.notFound{
margin-top:20px;
color:#f44336;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>🔍 AI検索</h1>

<p>単語を入力してください</p>

<input
type="text"
id="searchInput"
placeholder="例：一次予防"

>

<button onclick="searchWord()">
検索
</button>

<div id="result"></div>

<button
style="margin-top:20px;background:#777;"
onclick="location.href='home.html'"

>

ホーム </button>

</div>

</div>

<script>

// 仮データ
const dictionary = {

"一次予防":{
meaning:"病気になる前に予防すること。",
point:"予防接種・禁煙・運動習慣改善。",
memory:"一次＝病気になる前",
related:"予防接種",
chapter:"疾病予防"
},

"二次予防":{
meaning:"病気を早期発見・早期治療すること。",
point:"健康診断・がん検診。",
memory:"二次＝早期発見",
related:"健康診断",
chapter:"疾病予防"
}

};

function searchWord(){

const word =
document.getElementById("searchInput")
.value.trim();

const result =
document.getElementById("result");

if(!word){

result.innerHTML=
`
<div class="notFound">

単語を入力してください

</div>
`;

return;

}

let foundKey=null;

for(const key in dictionary){

const data=dictionary[key];

if(
key.includes(word) ||
word.includes(key) ||
data.meaning.includes(word) ||
data.point.includes(word)
){
foundKey=key;
break;
}

}

if(foundKey){

const data=dictionary[foundKey];

result.innerHTML=
`

<div class="resultBox">

<div class="keyword">

${foundKey}

</div>

<p>

<strong>意味</strong>

<br>

${data.meaning}

</p>

<div class="point">

<strong>国家試験ポイント</strong>

<br>

${data.point}

</div>

<div class="memory">

<strong>覚え方</strong>

<br>

${data.memory}

</div>

<div class="related">

<strong>関連キーワード</strong>

<br>

${data.related}

</div>

<p style="margin-top:15px;">

<strong>関連章</strong>

<br>

${data.chapter}

</p>

</div>

`;

}else{

result.innerHTML=
`
<div class="notFound">

該当する単語がありません

</div>
`;

}

}

</script>

</body>
</html>
