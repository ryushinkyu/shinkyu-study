<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI検索</title>

<link rel="stylesheet" href="style.css">

<style>

.resultBox{
margin-top:20px;
padding:15px;
background:#f9f9f9;
border-radius:10px;
line-height:1.8;
}

.keyword{
font-size:22px;
font-weight:bold;
color:#0288d1;
}

.point{
margin-top:15px;
padding:12px;
background:#fff3cd;
border-radius:10px;
}

.notFound{
margin-top:20px;
color:#f44336;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>

🔍 AI検索

</h1>

<p>

単語を入力してください

</p>

<input
type="text"
id="searchInput"
placeholder="例：一次予防"
>

<button onclick="searchWord()">

検索

</button>

<div id="result"></div>

<button
style="margin-top:20px;background:#777;"
onclick="location.href='home.html'"
>

ホーム

</button>

</div>

</div>

<script>

// ========================================
// 辞書
// ========================================

const dictionary = {

"一次予防":{

meaning:
"病気になる前に予防すること。",

point:
"予防接種・禁煙・運動習慣改善など。",

chapter:
"第2章 疾病予防"

},

"二次予防":{

meaning:
"病気を早期発見・早期治療すること。",

point:
"健康診断・がん検診・人間ドック。",

chapter:
"第2章 疾病予防"

},

"三次予防":{

meaning:
"病気の再発防止や社会復帰を目的とする。",

point:
"リハビリテーションが頻出。",

chapter:
"第2章 疾病予防"

},

"ハイリスクアプローチ":{

meaning:
"危険性の高い人へ重点的に指導する方法。",

point:
"喫煙者への禁煙指導など。",

chapter:
"第2章 疾病予防"

},

"ポピュレーションアプローチ":{

meaning:
"集団全体へ働きかける方法。",

point:
"減塩運動・健康キャンペーンなど。",

chapter:
"第2章 疾病予防"

},

"健康診断":{

meaning:
"病気の早期発見を目的とする。",

point:
"二次予防として超頻出。",

chapter:
"第2章 疾病予防"

},

"予防接種":{

meaning:
"感染症を予防するために行う。",

point:
"一次予防として超重要。",

chapter:
"第2章 疾病予防"

},

"リハビリ":{

meaning:
"機能回復や社会復帰を目指す。",

point:
"三次予防に分類される。",

chapter:
"第2章 疾病予防"

},

"保健所":{

meaning:
"地域保健を担う行政機関。",

point:
"感染症対策・食品衛生などを行う。",

chapter:
"第3章 保健行政"

},

"市町村保健センター":{

meaning:
"住民に身近な保健サービスを提供する。",

point:
"乳幼児健診などを行う。",

chapter:
"第3章 保健行政"

}

};


// ========================================
// 検索
// ========================================

function searchWord(){

const word =
document.getElementById("searchInput")
.value.trim();

const result =
document.getElementById("result");


// ===== 空 =====

if(!word){

result.innerHTML = `
<div class="notFound">

単語を入力してください

</div>
`;

return;

}


// ===== データ =====

const data = dictionary[word];


// ===== 見つかった =====

if(data){

result.innerHTML = `

<div class="resultBox">

<div class="keyword">

${word}

</div>

<p>

<strong>

意味：

</strong>

<br>

${data.meaning}

</p>

<div class="point">

<strong>

国家試験ポイント：

</strong>

<br>

${data.point}

</div>

<p style="margin-top:15px;">

<strong>

関連章：

</strong>

${data.chapter}

</p>

<button
style="margin-top:15px;"
onclick="location.href='lecture.html'"
>

講義を見る

</button>

<button
onclick="location.href='quiz.html'"
>

クイズへ

</button>

</div>

`;

}


// ===== 見つからない =====

else{

result.innerHTML = `

<div class="notFound">

該当する単語がありません

</div>

`;

}

}

</script>

</body>
</html>
