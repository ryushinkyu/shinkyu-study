<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>公衆衛生クイズ</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f5f5f5;
padding:10px;
box-sizing:border-box;
}

.container{
width:100%;
max-width:600px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.title{
text-align:center;
margin-bottom:20px;
}

.selectBox{
display:flex;
flex-direction:column;
gap:12px;
}

button{
width:100%;
padding:14px;
font-size:16px;
border:none;
border-radius:10px;
background:#2196f3;
color:white;
cursor:pointer;
}

button:active{
transform:scale(0.98);
}

.questionBox{
margin-top:20px;
padding:18px;
background:#f9f9f9;
border-radius:10px;
line-height:1.8;
font-size:18px;
}

.choiceBtn{
background:#ffffff;
color:#333;
border:1px solid #ccc;
margin-top:10px;
}

.choiceBtn:hover{
background:#e3f2fd;
}

.correct{
background:#d4edda !important;
color:#155724 !important;
border:2px solid #28a745 !important;
}

.wrong{
background:#f8d7da !important;
color:#721c24 !important;
border:2px solid #dc3545 !important;
}

.result{
margin-top:15px;
padding:15px;
border-radius:10px;
font-size:18px;
font-weight:bold;
}

.progress{
text-align:center;
margin-bottom:15px;
color:#666;
}

.scoreBox{
margin-top:20px;
padding:20px;
background:#f1f8e9;
border-radius:10px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.reviewMode{
background:#fff3cd;
color:#856404;
padding:12px;
border-radius:10px;
margin-bottom:15px;
text-align:center;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1 class="title">

🏥 公衆衛生クイズ

</h1>

<div id="app"></div>

<button
style="background:#777;margin-top:20px;"
onclick="goBack()"
>

戻る

</button>

</div>

</div>

<script>

// ========================================
// 復習モード取得
// ========================================

const reviewMode =
localStorage.getItem(
"reviewMode"
);

const reviewChapter =
localStorage.getItem(
"reviewChapter"
);


// ========================================
// 問題データ
// ========================================

const quizData = {

"WHO":[

{
question:"WHOのアルマ・アタ宣言で示されたのはどれか",
choices:[
"ヘルスプロモーション",
"インフォームド・コンセント",
"医学研究倫理",
"プライマリ・ヘルス・ケア"
],
answer:3,
chapter:"WHO"
},

{
question:"WHOの主な活動はどれか",
choices:[
"地域紛争の解決",
"難民の救助援助",
"労働条件の改善",
"保健統計の刊行"
],
answer:3,
chapter:"WHO"
}

],

"プライマリヘルスケア":[

{
question:"プライマリヘルスケアに含まれないのはどれか",
choices:[
"住民参加",
"包括的保健",
"高度先進医療",
"身近な医療"
],
answer:2,
chapter:"プライマリヘルスケア"
}

],

"疾病予防":[

{
question:"第一次予防はどれか",
choices:[
"健康教育",
"健康診断",
"リハビリ",
"社会復帰"
],
answer:0,
chapter:"疾病予防"
},

{
question:"第三次予防はどれか",
choices:[
"禁煙",
"予防接種",
"リハビリテーション",
"健康教育"
],
answer:2,
chapter:"疾病予防"
}

]

};


// ========================================
// 状態
// ========================================

let currentCategory = "";
let currentQuiz = [];
let currentIndex = 0;
let score = 0;


// ========================================
// メニュー表示
// ========================================

function showMenu(){

let html = `

<div class="selectBox">

`;

for(let key in quizData){

html += `

<button onclick="startQuiz('${key}')">

${key}

</button>

`;

}

html += `</div>`;

document.getElementById(
"app"
).innerHTML = html;

}


// ========================================
// クイズ開始
// ========================================

function startQuiz(category){

currentCategory = category;
currentQuiz = quizData[category];
currentIndex = 0;
score = 0;

showQuestion();

}


// ========================================
// 問題表示
// ========================================

function showQuestion(){

if(currentIndex >= currentQuiz.length){

document.getElementById(
"app"
).innerHTML = `

<div class="scoreBox">

${currentCategory}

<br><br>

${currentQuiz.length}問中
${score}問正解！

</div>

<button onclick="finishReview()">

カテゴリへ戻る

</button>

`;

return;

}

const q = currentQuiz[currentIndex];

let html = "";

if(reviewMode === "true"){

html += `

<div class="reviewMode">

📝 復習モード

</div>

`;

}

html += `

<div class="progress">

${currentIndex + 1}
/
${currentQuiz.length}

</div>

<div class="questionBox">

${q.question}

</div>

`;

q.choices.forEach((choice,index)=>{

html += `

<button
class="choiceBtn"
onclick="checkAnswer(${index})"
>

${index + 1}. ${choice}

</button>

`;

});

html += `<div id="result"></div>`;

document.getElementById(
"app"
).innerHTML = html;

}


// ========================================
// 回答判定
// ========================================

function checkAnswer(selected){

const q = currentQuiz[currentIndex];

const buttons =
document.querySelectorAll(
".choiceBtn"
);

buttons.forEach(btn=>{

btn.disabled = true;

});

buttons[q.answer]
.classList.add("correct");

if(selected === q.answer){

score++;

document.getElementById(
"result"
).innerHTML = `

<div class="result correct">

⭕ 正解！

</div>

`;

}

else{

buttons[selected]
.classList.add("wrong");

saveWrongQuestion(q);

document.getElementById(
"result"
).innerHTML = `

<div class="result wrong">

❌ 不正解

<br><br>

正解：
${q.answer + 1}

</div>

`;

}

document.getElementById(
"result"
).innerHTML += `

<button onclick="nextQuestion()">

次へ

</button>

`;

}


// ========================================
// 間違え保存
// ========================================

function saveWrongQuestion(q){

let wrongQuestions = JSON.parse(
localStorage.getItem(
"wrongQuestions_衛生学・公衆衛生学"
) || "[]"
);

const exists = wrongQuestions.some(item=>
item.question === q.question
);

if(!exists){

wrongQuestions.push(q);

}

localStorage.setItem(
"wrongQuestions_衛生学・公衆衛生学",
JSON.stringify(wrongQuestions)
);

}


// ========================================
// 次へ
// ========================================

function nextQuestion(){

currentIndex++;

showQuestion();

}


// ========================================
// 復習終了
// ========================================

function finishReview(){

localStorage.removeItem(
"reviewMode"
);

localStorage.removeItem(
"reviewChapter"
);

showMenu();

}


// ========================================
// 戻る
// ========================================

function goBack(){

localStorage.removeItem(
"reviewMode"
);

localStorage.removeItem(
"reviewChapter"
);

location.href =
"quizMenu.html";

}


// ========================================
// 起動
// ========================================

if(reviewMode === "true"){

let wrongQuestions = JSON.parse(
localStorage.getItem(
"wrongQuestions_衛生学・公衆衛生学"
) || "[]"
);

currentCategory = reviewChapter;

currentQuiz = wrongQuestions.filter(q=>
q.chapter === reviewChapter
);

currentIndex = 0;
score = 0;

showQuestion();

}

else{

showMenu();

}

</script>

</body>
</html>
