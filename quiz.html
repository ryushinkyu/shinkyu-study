<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>クイズ</title>

<link rel="stylesheet" href="style.css">

<style>

.choiceBtn{
display:block;
width:100%;
margin-top:10px;
}

.correct{
background:#2196f3 !important;
color:white;
}

.wrong{
background:#f44336 !important;
color:white;
}

.resultBox{
margin-top:20px;
padding:15px;
border-radius:10px;
background:#f5f5f5;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>クイズ</h1>

<div id="quiz"></div>

</div>

</div>

<script>

// ========================================
// 問題データ
// ========================================

const allQuiz = {

"衛生学・公衆衛生学":{

// ========================================
// 第2章 疾病予防
// ========================================

"疾病予防":[

{
question:"一次予防はどれか。",
choices:[
"リハビリテーション",
"健康診断",
"予防接種",
"社会復帰支援"
],
answer:2
},

{
question:"二次予防はどれか。",
choices:[
"健康教育",
"予防接種",
"健康診断",
"機能回復訓練"
],
answer:2
},

{
question:"三次予防はどれか。",
choices:[
"生活習慣改善",
"リハビリテーション",
"予防接種",
"健康診断"
],
answer:1
},

{
question:"疾病の早期発見・早期治療を目的とするのはどれか。",
choices:[
"一次予防",
"二次予防",
"三次予防",
"ゼロ次予防"
],
answer:1
},

{
question:"健康増進を目的とするのはどれか。",
choices:[
"一次予防",
"二次予防",
"三次予防",
"四次予防"
],
answer:0
},

{
question:"予防接種はどれに該当するか。",
choices:[
"一次予防",
"二次予防",
"三次予防",
"四次予防"
],
answer:0
},

{
question:"人間ドックはどれに該当するか。",
choices:[
"一次予防",
"二次予防",
"三次予防",
"四次予防"
],
answer:1
},

{
question:"機能回復訓練はどれに該当するか。",
choices:[
"一次予防",
"二次予防",
"三次予防",
"ゼロ次予防"
],
answer:2
},

{
question:"ハイリスクアプローチはどれか。",
choices:[
"集団全体への健康教育",
"喫煙者への禁煙指導",
"地域全体への減塩活動",
"ウォーキングイベント"
],
answer:1
},

{
question:"ポピュレーションアプローチはどれか。",
choices:[
"糖尿病患者への個別指導",
"高血圧患者への保健指導",
"住民全体への減塩運動",
"喫煙者のみへの禁煙指導"
],
answer:2
},

{
question:"健康診査の目的として正しいのはどれか。",
choices:[
"機能回復",
"疾病予防",
"早期発見",
"社会復帰"
],
answer:2
},

{
question:"リハビリテーションの目的として正しいのはどれか。",
choices:[
"疾病予防",
"健康増進",
"社会復帰",
"発病予防"
],
answer:2
},

{
question:"がん検診はどれに分類されるか。",
choices:[
"一次予防",
"二次予防",
"三次予防",
"四次予防"
],
answer:1
},

{
question:"禁煙指導はどれに分類されるか。",
choices:[
"一次予防",
"二次予防",
"三次予防",
"四次予防"
],
answer:0
},

{
question:"疾病の再発防止を目的とするのはどれか。",
choices:[
"一次予防",
"二次予防",
"三次予防",
"ゼロ次予防"
],
answer:2
},

{
question:"疾病予防について正しいのはどれか。",
choices:[
"一次予防は早期発見を目的とする",
"二次予防は健康増進を目的とする",
"三次予防は社会復帰を目的とする",
"二次予防は発病予防を目的とする"
],
answer:2
},

{
question:"特定健康診査はどれに該当するか。",
choices:[
"一次予防",
"二次予防",
"三次予防",
"ゼロ次予防"
],
answer:1
},

{
question:"生活習慣病予防のための運動習慣改善はどれか。",
choices:[
"一次予防",
"二次予防",
"三次予防",
"四次予防"
],
answer:0
},

{
question:"脳卒中後の社会復帰支援はどれか。",
choices:[
"一次予防",
"二次予防",
"三次予防",
"ゼロ次予防"
],
answer:2
},

{
question:"疾病予防におけるゼロ次予防で正しいのはどれか。",
choices:[
"健康診断を行う",
"リハビリを行う",
"自然に健康になれる環境を整える",
"薬物療法を行う"
],
answer:2
}

]

}

};


// ========================================
// 科目
// ========================================

const subject = localStorage.getItem("selectedSubject");


// ========================================
// 状態
// ========================================

let selectedChapter = "";

let quiz = [];

let quizIndex = 0;

let score = 0;

let results = [];


// ========================================
// 初期表示
// ========================================

showChapterMenu();


// ========================================
// 章選択
// ========================================

function showChapterMenu(){

const chapters = allQuiz[subject];

let html = `

<h2>

章を選択

</h2>

`;

for(let chapter in chapters){

html += `

<button
class="choiceBtn"
onclick="startQuiz('${chapter}')"
>

${chapter}

</button>

`;

}

html += `

<button
style="margin-top:20px;"
onclick="location.href='quizMenu.html'"
>

科目選択へ

</button>

`;

document.getElementById("quiz").innerHTML = html;

}


// ========================================
// クイズ開始
// ========================================

function startQuiz(chapter){

selectedChapter = chapter;

quiz = allQuiz[subject][chapter];

quiz = quiz.sort(()=>Math.random()-0.5);

quiz = quiz.slice(0,5);

quiz = quiz.map((q,i)=>({

...q,
index:i,
chapter:chapter

}));

quizIndex = 0;

score = 0;

results = [];

showQuestion();

}


// ========================================
// 問題表示
// ========================================

function showQuestion(){

if(quizIndex >= quiz.length){

showResult();

return;

}

const q = quiz[quizIndex];

let html = `

<h2>

${selectedChapter}

</h2>

<p>

問題 ${quizIndex+1}

</p>

<p style="margin-top:20px;">

${q.question}

</p>

`;

q.choices.forEach((choice,i)=>{

html += `

<button
class="choiceBtn"
onclick="answer(${i})"
>

${i+1}．${choice}

</button>

`;

});

document.getElementById("quiz").innerHTML = html;

}


// ========================================
// 回答
// ========================================

function answer(choice){

const q = quiz[quizIndex];

const correct = q.answer;

const buttons = document.querySelectorAll(".choiceBtn");

buttons.forEach(btn=>{

btn.disabled = true;

});

let resultHtml = "";


// ========================================
// 復習取得
// ========================================

let wrong = JSON.parse(
localStorage.getItem("wrongQuestions_"+subject) || "[]"
);


// ========================================
// 正解
// ========================================

if(choice === correct){

score++;

results.push(true);

buttons[choice].classList.add("correct");

resultHtml += `

<div class="resultBox">

<h3 style="color:#2196f3;">

⭕ 正解！

</h3>

</div>

`;

wrong = wrong.filter(w =>

w.questionData.question !== q.question

);

}


// ========================================
// 不正解
// ========================================

else{

results.push(false);

buttons[choice].classList.add("wrong");

buttons[correct].classList.add("correct");

resultHtml += `

<div class="resultBox">

<h3 style="color:#f44336;">

❌ 不正解

</h3>

<p>

正解：
${q.choices[correct]}

</p>

</div>

`;

const exists = wrong.find(w =>

w.questionData.question === q.question

);

if(!exists){

wrong.push({

index:q.index,

userAnswer:choice,

questionData:q

});

}

}


// ========================================
// 保存
// ========================================

localStorage.setItem(
"wrongQuestions_"+subject,
JSON.stringify(wrong)
);


// ========================================
// 次へ
// ========================================

resultHtml += `

<button
style="margin-top:15px;"
onclick="nextQuestion()"
>

次へ

</button>

`;

document.getElementById("quiz").innerHTML += resultHtml;

}


// ========================================
// 次へ
// ========================================

function nextQuestion(){

quizIndex++;

showQuestion();

}


// ========================================
// 結果
// ========================================

function showResult(){

let html = `

<h2>

終了！

</h2>

<p>

${selectedChapter}

</p>

<p>

スコア：
${score} / ${quiz.length}

</p>

`;

results.forEach((r,i)=>{

html += `

<p>

問題${i+1}：
${r ? "⭕" : "❌"}

</p>

`;

});

html += `

<button onclick="showChapterMenu()">

章選択へ

</button>

<button onclick="location.href='review.html'">

復習リスト

</button>

<button onclick="location.href='home.html'">

ホーム

</button>

`;

document.getElementById("quiz").innerHTML = html;

}

</script>

</body>
</html>
