<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>クイズ</title>

<link rel="stylesheet" href="style.css">

<style>

.choiceBtn{
display:block;
width:100%;
margin-top:10px;
}

.correct{
background:#2196f3 !important;
color:white;
}

.wrong{
background:#f44336 !important;
color:white;
}

.resultBox{
margin-top:20px;
padding:15px;
border-radius:10px;
background:#f5f5f5;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>クイズ</h1>

<div id="quiz"></div>

</div>

</div>

<script>

// ========================================
// 問題データ
// ========================================

const allQuiz = {

"衛生学・公衆衛生学":{

// ========================================
// 健康・疾病予防
// ========================================

"健康・疾病予防":[

{
question:"一次予防はどれか",
choices:[
"リハビリ",
"生活環境改善",
"がん検診",
"社会復帰"
],
answer:1
},

{
question:"二次予防はどれか",
choices:[
"健康診断",
"予防接種",
"禁煙",
"機能訓練"
],
answer:0
},

{
question:"三次予防はどれか",
choices:[
"健康教育",
"予防接種",
"健康診査",
"リハビリテーション"
],
answer:3
},

{
question:"第一次予防でないのはどれか",
choices:[
"予防接種",
"健康教育",
"禁煙",
"健康診断"
],
answer:3
},

{
question:"ハイリスクアプローチはどれか",
choices:[
"禁煙指導",
"ウォーキング大会",
"広報活動",
"健康教育"
],
answer:0
}

],

// ========================================
// 感染症
// ========================================

"感染症":[

{
question:"地球上から根絶された感染症はどれか",
choices:[
"コレラ",
"破傷風",
"痘そう",
"ポリオ"
],
answer:2
},

{
question:"細菌感染症はどれか",
choices:[
"デング熱",
"マラリア",
"ハンセン病",
"SARS"
],
answer:2
},

{
question:"ウイルスが原因となる疾病はどれか",
choices:[
"淋病",
"発疹チフス",
"ジフテリア",
"エイズ"
],
answer:3
},

{
question:"蚊が媒介する感染症はどれか",
choices:[
"腸チフス",
"ペスト",
"日本脳炎",
"エイズ"
],
answer:2
},

{
question:"空気感染対策が有効なのはどれか",
choices:[
"赤痢",
"コレラ",
"結核",
"ポリオ"
],
answer:2
}

],

// ========================================
// 疫学・統計
// ========================================

"疫学・統計":[

{
question:"有病率について正しいのはどれか",
choices:[
"ある時点での病気の割合",
"新しく発症した割合",
"死亡者の割合",
"出生の割合"
],
answer:0
},

{
question:"コホート研究で正しいのはどれか",
choices:[
"罹患率を求められる",
"研究期間が短い",
"後ろ向き研究のみ",
"まれな疾患向き"
],
answer:0
},

{
question:"曝露群が非曝露群に比べ何倍罹患しやすいかを示すのはどれか",
choices:[
"相対危険",
"寄与危険",
"有病率",
"死亡率"
],
answer:0
},

{
question:"国勢調査は何年ごとか",
choices:[
"3年",
"5年",
"7年",
"10年"
],
answer:1
},

{
question:"乳児死亡率の分母はどれか",
choices:[
"人口",
"出生数",
"死亡数",
"妊婦数"
],
answer:1
}

],

// ========================================
// 食中毒・栄養
// ========================================

"食中毒・栄養":[

{
question:"食中毒で正しいのはどれか",
choices:[
"サルモネラは水洗いで防止",
"ブドウ球菌毒素は熱に弱い",
"腸炎ビブリオは60℃で死滅",
"ボツリヌス毒素は熱に強い"
],
answer:2
},

{
question:"最も短時間で発症する食中毒はどれか",
choices:[
"ブドウ球菌",
"サルモネラ",
"腸炎ビブリオ",
"病原大腸菌"
],
answer:0
},

{
question:"アニサキス症の主症状はどれか",
choices:[
"発熱",
"腹痛",
"下痢",
"血尿"
],
answer:1
},

{
question:"食中毒予防でないのはどれか",
choices:[
"手洗い",
"加熱",
"水質検査",
"患者隔離"
],
answer:3
},

{
question:"ノロウイルスと関連するのはどれか",
choices:[
"貝類",
"手指化膿",
"魚介類",
"ネズミ"
],
answer:0
}

]

}

};

// ========================================
// 科目
// ========================================

const subject = localStorage.getItem("selectedSubject");

// ========================================
// 状態
// ========================================

let selectedChapter = "";

let quiz = [];

let quizIndex = 0;

let score = 0;

let results = [];

// ========================================
// 初期表示
// ========================================

showChapterMenu();

// ========================================
// 章選択
// ========================================

function showChapterMenu(){

const chapters = allQuiz[subject];

let html = `

<h2>

章を選択

</h2>

`;

for(let chapter in chapters){

html += `

<button
class="choiceBtn"
onclick="startQuiz('${chapter}')"
>

${chapter}

</button>

`;

}

html += `

<button
style="margin-top:20px;"
onclick="location.href='quizMenu.html'"
>

科目選択へ

</button>

`;

document.getElementById("quiz").innerHTML = html;

}

// ========================================
// 開始
// ========================================

function startQuiz(chapter){

selectedChapter = chapter;

quiz = allQuiz[subject][chapter];

// シャッフル
quiz = quiz.sort(()=>Math.random()-0.5);

// 5問
quiz = quiz.slice(0,5);

// index追加
quiz = quiz.map((q,i)=>({

...q,
index:i,
chapter:chapter

}));

quizIndex = 0;

score = 0;

results = [];

showQuestion();

}

// ========================================
// 問題表示
// ========================================

function showQuestion(){

if(quizIndex >= quiz.length){

showResult();
return;

}

const q = quiz[quizIndex];

let html = `

<h2>

${selectedChapter}

</h2>

<p>

問題 ${quizIndex+1}

</p>

<p style="margin-top:20px;">

${q.question}

</p>

`;

q.choices.forEach((choice,i)=>{

html += `

<button
class="choiceBtn"
onclick="answer(${i})"
>

${i+1}．${choice}

</button>

`;

});

document.getElementById("quiz").innerHTML = html;

}

// ========================================
// 回答
// ========================================

function answer(choice){

const q = quiz[quizIndex];

const correct = q.answer;

const buttons = document.querySelectorAll(".choiceBtn");

buttons.forEach(btn=>{

btn.disabled = true;

});

let resultHtml = "";

// ========================================
// 復習取得
// ========================================

let wrong = JSON.parse(
localStorage.getItem("wrongQuestions_"+subject) || "[]"
);

// ========================================
// 正解
// ========================================

if(choice === correct){

score++;

results.push(true);

buttons[choice].classList.add("correct");

resultHtml += `

<div class="resultBox">

<h3 style="color:#2196f3;">

⭕ 正解！

</h3>

</div>

`;

// 復習から削除

wrong = wrong.filter(w =>

w.questionData.question !== q.question

);

}

// ========================================
// 不正解
// ========================================

else{

results.push(false);

buttons[choice].classList.add("wrong");

buttons[correct].classList.add("correct");

resultHtml += `

<div class="resultBox">

<h3 style="color:#f44336;">

❌ 不正解

</h3>

<p>

正解：
${q.choices[correct]}

</p>

</div>

`;

const exists = wrong.find(w =>

w.questionData.question === q.question

);

if(!exists){

wrong.push({

index:q.index,

userAnswer:choice,

questionData:q

});

}

}

// ========================================
// 保存
// ========================================

localStorage.setItem(
"wrongQuestions_"+subject,
JSON.stringify(wrong)
);

// ========================================
// 次へ
// ========================================

resultHtml += `

<button
style="margin-top:15px;"
onclick="nextQuestion()"
>

次へ

</button>

`;

document.getElementById("quiz").innerHTML += resultHtml;

}

// ========================================
// 次へ
// ========================================

function nextQuestion(){

quizIndex++;

showQuestion();

}

// ========================================
// 結果
// ========================================

function showResult(){

let html = `

<h2>

終了！

</h2>

<p>

${selectedChapter}

</p>

<p>

スコア：
${score} / ${quiz.length}

</p>

`;

results.forEach((r,i)=>{

html += `

<p>

問題${i+1}：
${r ? "⭕" : "❌"}

</p>

`;

});

html += `

<button onclick="showChapterMenu()">

章選択へ

</button>

<button onclick="location.href='review.html'">

復習リスト

</button>

<button onclick="location.href='home.html'">

ホーム

</button>

`;

document.getElementById("quiz").innerHTML = html;

}

</script>

</body>
</html>
