          "目標5は「ジェンダー平等を実現しよう」です。目標3は「すべての人に健康と福祉を」です。"
      },
      level3: {
        question: "SDGsの目標5として正しいのはどれか。",
        choices: [
          "すべての人に健康と福祉を",
          "ジェンダー平等を実現しよう",
          "質の高い教育をみんなに",
          "安全な水とトイレを世界中に"
        ],
        answer: 1,
        explanation:
          "SDGsの目標5は「ジェンダー平等を実現しよう」です。目標3は「すべての人に健康と福祉を」、目標4は「質の高い教育をみんなに」、目標6は「安全な水とトイレを世界中に」です。"
      }
    },
    {
      source: "第24回問題11",
      question: "我が国の保健医療分野の国際協力について正しいのはどれか。",
      choices: [
        "ODAは無償資金協力を行っていない",
        "日本はWHOの東南アジア事務局に属している",
        "二国間協力の実施機関はJICA",
        "NGOによる医療協力は実施していない"
      ],
      answer: 2,
      explanation:
        "JICA（国際協力機構）は日本の二国間協力を担う主要な実施機関です。日本が属するWHOの地域事務局は西太平洋地域事務局です。ODAには無償資金協力があり、NGOも医療協力を実施しています。",
      level1: {
        question: "JICAは主に何に関係する機関か。",
        choices: [
          "日本の国際協力",
          "国内の裁判",
          "国際スポーツ大会の審判",
          "軍事作戦の指揮"
        ],
        answer: 0,
        explanation:
          "JICA（国際協力機構）は、日本の国際協力を担う機関です。"
      },
      level2: {
        question: "日本の二国間協力を担う主要な実施機関はどれか。",
        choices: ["WHO", "JICA", "IOC", "WTO"],
        answer: 1,
        explanation:
          "JICAは日本の二国間協力を担う主要な実施機関です。WHOは世界保健機関です。"
      },
      level3: {
        question: "我が国の保健医療分野の国際協力について正しいのはどれか。",
        choices: [
          "日本はWHOの東南アジア地域に属する",
          "JICAは日本の二国間援助を担う主要な実施機関である",
          "政府開発援助（ODA）では無償資金協力を行わない",
          "NGOは保健医療分野の国際協力に参加していない"
        ],
        answer: 1,
        explanation:
          "JICA（国際協力機構）は日本の二国間協力を担う主要な実施機関です。日本はWHOの西太平洋地域に属します。ODAには無償資金協力があり、NGOも保健医療分野の国際協力に参加しています。"
      }
    }
  ];

  let quiz = questions.slice();
  let quizIndex = 0;
  let score = 0;
  let results = [];
  let reviewMode = false;
  let currentFlow = null;

  const menu = document.getElementById("menu");
  const quizArea = document.getElementById("quiz");

  document.getElementById("startButton").addEventListener("click", function () {
    reviewMode = false;
    quiz = questions.slice();
    startQuiz();
  });

  document.getElementById("reviewButton").addEventListener("click", function () {
    const wrongIndexes = readWrongIndexes()
      .filter(i => Number.isInteger(i) && i >= 0 && i < questions.length);

    if (wrongIndexes.length === 0) {
      alert("間違えた問題はまだありません。");
      return;
    }

    reviewMode = true;
    quiz = wrongIndexes.map(i => questions[i]);
    startQuiz();
  });

  document.getElementById("subjectButton").addEventListener("click", function () {
    location.href = "quizMenu.html";
  });

  function readWrongIndexes() {
    try {
      const data = JSON.parse(
        localStorage.getItem("wrongQuestions_" + CATEGORY) || "[]"
      );
      return Array.isArray(data) ? data : [];
    } catch (error) {
      return [];
    }
  }

  function saveWrongIndexes(indexes) {
    localStorage.setItem(
      "wrongQuestions_" + CATEGORY,
      JSON.stringify([...new Set(indexes)].sort((a, b) => a - b))
    );
  }

  function startQuiz() {
    quizIndex = 0;
    score = 0;
    results = [];
    currentFlow = null;
    menu.classList.add("hidden");
    quizArea.innerHTML = "";
    showQuiz();
  }

  function showQuiz() {
    currentFlow = null;

    if (quizIndex >= quiz.length) {
      showResult();
      return;
    }

    renderQuestion(quiz[quizIndex], "original");
  }

  function renderQuestion(q, mode) {
    const isOriginal = mode === "original";
    const heading = isOriginal
      ? `問題 ${quizIndex + 1} / ${quiz.length}`
      : `復習レベル ${currentFlow.level} / 3`;

    const levelText = isOriginal
      ? ""
      : `<div class="level-label">レベル${currentFlow.level}</div>`;

    const sourceText = isOriginal
      ? `<p class="progress">${reviewMode ? "復習クイズ" : "通常クイズ"}　${quizIndex + 1} / ${quiz.length}問　（${q.source}）</p>`
      : "";

    quizArea.innerHTML = `
      <div class="card">
        ${sourceText}
        ${levelText}
        <h2>${heading}</h2>
        <p>${q.question}</p>
        <div id="choices"></div>
        <div id="feedback" class="feedback" aria-live="polite"></div>
        <div id="explanation" class="point hidden"></div>
        <div id="actionButtons"></div>
      </div>
    `;

    const choices = document.getElementById("choices");

    q.choices.forEach(function (choice, index) {
      const button = document.createElement("button");
      button.className = "choiceBtn";
      button.textContent = `${index + 1}．${choice}`;
      button.addEventListener("click", function () {
        checkAnswer(index, q, mode);
      });
      choices.appendChild(button);
    });
  }

  function checkAnswer(selectedIndex, q, mode) {
    const buttons = document.querySelectorAll(".choiceBtn");

    if (buttons.length === 0 || buttons[0].disabled) {
      return;
    }

    buttons.forEach(button => button.disabled = true);

    const correct = selectedIndex === q.answer;

    buttons[q.answer].classList.add("correct");

    if (!correct) {
      buttons[selectedIndex].classList.add("wrong");
    }

    const feedback = document.getElementById("feedback");
    feedback.textContent = correct
      ? "⭕ 正解！"
      : `❌ 不正解。正解は「${q.choices[q.answer]}」です。`;
    feedback.style.color = correct ? "#218838" : "#d32f2f";

    const explanation = document.getElementById("explanation");
    explanation.textContent = "解説：" + q.explanation;
    explanation.classList.remove("hidden");

    const actions = document.getElementById("actionButtons");

    if (mode === "original") {
      const originalIndex = questions.indexOf(q);

      // 採点対象は元の問題だけ。類似問題の結果は元問題の得点に加えません。
      results.push(correct);
      if (correct) {
        score++;
      }

      // 元問題の正誤を保存します。
      let wrong = readWrongIndexes();

      if (correct) {
        wrong = wrong.filter(i => i !== originalIndex);
      } else if (originalIndex >= 0 && !wrong.includes(originalIndex)) {
        wrong.push(originalIndex);
      }

      saveWrongIndexes(wrong);

      if (correct) {
        /*
          重要：
          元の問題に正解した場合は、次の元問題へ進むボタンを出さず、
          必ずその問題のレベル3類似問題へ進ませます。
        */
        actions.innerHTML = `
          <p class="point">
            正解！続けて、同じテーマの国家試験レベル類似問題に挑戦しましょう。
          </p>
          <button id="similarButton" class="button-accent">
            類似問題へ進む
          </button>
        `;

        document.getElementById("similarButton").addEventListener("click", function () {
          currentFlow = {
            level: 3,
            originalIndex: originalIndex
          };

          // 不正解からの復習と同じlevel3問題を使用します。
          renderQuestion(questions[originalIndex].level3, "level");
        });

      } else {
        // 不正解なら、次の問題へ進むかレベル1から復習するかを選べます。
        actions.innerHTML = `
          <button id="nextOriginalButton">次の問題へ</button>
          <button id="level1Button" class="button-accent">
            レベル1から復習
          </button>
        `;

        document.getElementById("nextOriginalButton").addEventListener("click", function () {
          quizIndex++;
          showQuiz();
        });

        document.getElementById("level1Button").addEventListener("click", function () {
          currentFlow = {
            level: 1,
            originalIndex: originalIndex
          };

          renderQuestion(questions[originalIndex].level1, "level");
        });
      }

    } else {
      // 復習問題は、正解・不正解にかかわらず次のレベルへ進みます。
      if (currentFlow.level < 3) {
        const nextLevel = currentFlow.level + 1;

        actions.innerHTML = `
          <button id="nextLevelButton">
            レベル${nextLevel}へ進む
          </button>
        `;

        document.getElementById("nextLevelButton").addEventListener("click", function () {
          currentFlow.level = nextLevel;

          const nextQuestion =
            questions[currentFlow.originalIndex][`level${nextLevel}`];

          renderQuestion(nextQuestion, "level");
        });

      } else {
        // レベル3終了後は次の元問題へ進みます。
        actions.innerHTML = `
          <button id="nextOriginalButton">次の問題へ</button>
        `;

        document.getElementById("nextOriginalButton").addEventListener("click", function () {
          quizIndex++;
          showQuiz();
        });
      }
    }
  }

  function showResult() {
    const percent = quiz.length
      ? Math.round(score / quiz.length * 100)
      : 0;

    quizArea.innerHTML = `
      <div class="card">
        <h2>クイズ終了！</h2>
        <p><strong>スコア：${score} / ${quiz.length}</strong></p>
        <p><strong>正答率：${percent}%</strong></p>
        <div id="answerDetails"></div>
        <button id="retryButton">もう一度挑戦</button>
        <button id="menuButton" style="background:#777;">
          クイズ選択に戻る
        </button>
      </div>
    `;

    const details = document.getElementById("answerDetails");

    results.forEach(function (correct, i) {
      const p = document.createElement("p");
      p.textContent = `問題${i + 1}：${correct ? "⭕ 正解" : "❌ 不正解"}`;
      details.appendChild(p);
    });

    saveHistory(percent);

    document.getElementById("retryButton").addEventListener("click", function () {
      quiz = reviewMode
        ? readWrongIndexes()
            .filter(i => Number.isInteger(i) && i >= 0 && i < questions.length)
            .map(i => questions[i])
        : questions.slice();

      if (quiz.length === 0) {
        alert("復習できる問題がありません。");
        returnToMenu();
        return;
      }

      startQuiz();
    });

    document.getElementById("menuButton").addEventListener("click", returnToMenu);
  }

  function returnToMenu() {
    quizArea.innerHTML = "";
    menu.classList.remove("hidden");
  }

  function saveHistory(percent) {
    try {
      const currentUser = localStorage.getItem("currentUser");

      if (!currentUser) {
        return;
      }

      const history = JSON.parse(
        localStorage.getItem("quizHistory") || "{}"
      );

      if (!history[currentUser] || !Array.isArray(history[currentUser])) {
        history[currentUser] = [];
      }

      history[currentUser].push({
        subject: HISTORY_CATEGORY,
        score: score,
        total: quiz.length,
        percentage: percent,
        date: new Date().toLocaleString("ja-JP"),
        detail: results.slice()
      });

      localStorage.setItem("quizHistory", JSON.stringify(history));

    } catch (error) {
      console.error("クイズ履歴の保存に失敗しました。", error);
    }
  }

  window.goHome = function () {
    location.href = "home.html";
  };
});
</script>
