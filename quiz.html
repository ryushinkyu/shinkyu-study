<!DOCTYPE html>
<html lang="ja">
<head>

<link rel="stylesheet" href="style.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>鍼灸Study - クイズ</title>

<style>

.chapterBtn{
width:100%;
margin-top:10px;
}

.choiceBtn{
width:100%;
margin-top:10px;
}

.correct{
background:#2196f3 !important;
color:white;
}

.wrong{
background:#f44336 !important;
color:white;
}

.point{
margin-top:15px;
padding:15px;
background:#fff3cd;
border-radius:10px;
}

.resultBox{
margin-top:15px;
padding:15px;
background:#f9f9f9;
border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">
<h1>クイズ</h1>
</div>

<div id="menu"></div>
<div id="quiz"></div>

</div>

<script>

// =====================================
// 科目
// =====================================

const subject =
localStorage.getItem("selectedSubject");


// =====================================
// 問題
// =====================================

const allQuiz = {

"衛生学・公衆衛生学":{

"第2章 疾病予防":[

{
question:"第一次予防でないのはどれか",
choices:[
"健康教育",
"安全な水の供給",
"予防接種",
"健康診査"
],
answer:3
},

{
question:"一次予防はどれか",
choices:[
"リハビリテーション",
"生活環境改善",
"がん検診",
"社会復帰"
],
answer:1
},

{
question:"二次予防はどれか",
choices:[
"健康診断",
"予防接種",
"禁煙",
"機能訓練"
],
answer:0
},

{
question:"疾病予防のうち二次予防はどれか",
choices:[
"健康教育",
"健康診断",
"予防接種",
"作業療法"
],
answer:1
},

{
question:"二次予防に分類されるのはどれか",
choices:[
"遺伝相談",
"感染経路対策",
"発がん物質対策",
"スクリーニング検査"
],
answer:3
},

{
question:"第三次予防はどれか",
choices:[
"リハビリテーション",
"禁煙",
"がん検診",
"予防接種"
],
answer:0
},

{
question:"三次予防はどれか",
choices:[
"安全な水の供給",
"がん検診",
"事故防止",
"適正配置"
],
answer:3
},

{
question:"疾病の三次予防はどれか",
choices:[
"健康教育",
"予防接種",
"健康診査",
"リハビリテーション"
],
answer:3
},

{
question:"予防保健と対策との組合せで正しいのはどれか",
choices:[
"健康増進 ― 職業訓練",
"第一次予防 ― 予防接種",
"第二次予防 ― 事故防止",
"第三次予防 ― 職業病対策"
],
answer:1
},

{
question:"公衆衛生について誤っている組合せはどれか",
choices:[
"第一次予防 ─ 健康増進",
"第二次予防 ─ 予防接種",
"第三次予防 ─ 社会復帰",
"包括保健 ─ 総合的保健"
],
answer:1
},

{
question:"疾患と第一次予防との組合せで効果のないのはどれか",
choices:[
"脳梗塞 ─ 動物性脂肪の摂取",
"心筋梗塞 ─ ストレスの回避",
"糖尿病 ─ 適度の運動",
"肺癌 ─ 禁煙"
],
answer:0
},

{
question:"予防について正しい組合せはどれか",
choices:[
"がん検診 ― 第一次予防",
"予防接種 ― 第二次予防",
"禁酒 ― 第二次予防",
"リハビリテーション ― 第三次予防"
],
answer:3
},

{
question:"健康日本21（第三次）で示された『自然に健康になれる環境づくり』に相当する予防段階はどれか",
choices:[
"0次予防",
"1次予防",
"2次予防",
"3次予防"
],
answer:0
},

{
question:"結核対策で早期発見を目的とするのはどれか",
choices:[
"結核登録",
"定期健康診断",
"定期予防接種",
"家庭訪問指導"
],
answer:1
},

{
question:"ハイリスクアプローチはどれか",
choices:[
"受動喫煙を減らす法整備",
"食習慣改善の広報活動",
"市民対象のウォーキング大会",
"喫煙者への禁煙指導"
],
answer:3
},

{
question:"ハイリスクアプローチでないのはどれか",
choices:[
"喫煙者への禁煙指導",
"市民対象のウォーキング大会",
"糖尿病予備群への運動指導",
"塩分摂取量が多い者への食事指導"
],
answer:1
},

{
question:"一次予防に含まれるのはどれか",
choices:[
"健康教育",
"健康診断",
"リハビリテーション",
"機能訓練"
],
answer:0
},

{
question:"二次予防に含まれるのはどれか",
choices:[
"予防接種",
"健康診断",
"禁煙指導",
"運動習慣"
],
answer:1
},

{
question:"三次予防に含まれるのはどれか",
choices:[
"予防接種",
"健康教育",
"社会復帰",
"健康診断"
],
answer:2
},

{
question:"疾病予防で一次予防に該当するのはどれか",
choices:[
"がん検診",
"リハビリテーション",
"予防接種",
"機能回復訓練"
],
answer:2
}

]

}

};


// =====================================
// 状態
// =====================================

let currentQuiz = [];
let quizIndex = 0;
let score = 0;
let results = [];
let currentChapter = "";

showMenu();


// =====================================
// メニュー
// =====================================

function showMenu(){

document.getElementById("quiz").innerHTML = "";

let html = `
<div class="card">

<h3>

章を選択

</h3>
`;

const chapters = allQuiz[subject];

for(let chapter in chapters){

html += `
<button
class="chapterBtn"
onclick="startQuiz('${chapter}')"
>

${chapter}

</button>
`;

}

html += `
<button
style="background:#777;"
onclick="location.href='quizMenu.html'"
>

科目選択へ戻る

</button>

</div>
`;

document.getElementById("menu").innerHTML = html;

}


// =====================================
// 開始
// =====================================

function startQuiz(chapter){

currentChapter = chapter;

currentQuiz =
allQuiz[subject][chapter]
.sort(()=>Math.random()-0.5)
.slice(0,5);

quizIndex = 0;
score = 0;
results = [];

document.getElementById("menu").innerHTML = "";

showQuiz();

}


// =====================================
// 表示
// =====================================

function showQuiz(){

if(quizIndex >= currentQuiz.length){

let html = `
<div class="card">

<h2>

終了！

</h2>

<p>

${score} / ${currentQuiz.length}

</p>

<div class="resultBox">

${results.map((r,i)=>`

<p>

問題${i+1}：
${r ? "⭕" : "❌"}

</p>

`).join("")}

</div>

<button onclick="showMenu()">

章選択へ戻る

</button>

<button
style="background:#777;"
onclick="location.href='home.html'"
>

ホーム

</button>

</div>
`;

document.getElementById("quiz").innerHTML = html;

return;

}

const q = currentQuiz[quizIndex];

let html = `
<div class="card">

<h3>

${currentChapter}

</h3>

<h2>

問題 ${quizIndex+1}

</h2>

<p>

${q.question}

</p>
`;

q.choices.forEach((choice,index)=>{

html += `
<button
class="choiceBtn"
onclick="checkAnswer(${index})"
>

${index+1}．${choice}

</button>
`;

});

html += `</div>`;

document.getElementById("quiz").innerHTML = html;

}


// =====================================
// 判定
// =====================================

function checkAnswer(num){

let q = currentQuiz[quizIndex];

let buttons =
document.querySelectorAll(".choiceBtn");

buttons.forEach(btn=>btn.disabled=true);

let wrong = JSON.parse(
localStorage.getItem(
"wrongQuestions_"+subject
) || "[]"
);


// ===== 正解 =====

if(num === q.answer){

buttons[num].classList.add("correct");

score++;

results.push(true);

}
else{

results.push(false);

buttons[num].classList.add("wrong");

buttons[q.answer].classList.add("correct");

wrong.push({
questionData:q,
userAnswer:num,
chapter:currentChapter
});

localStorage.setItem(
"wrongQuestions_"+subject,
JSON.stringify(wrong)
);

}


// ===== 解説 =====

let html = `
<div class="point">

<strong>

正解：

</strong>

<br><br>

${q.choices[q.answer]}

</div>

<button
onclick="nextQuestion()"
>

次へ

</button>
`;

document.getElementById("quiz")
.innerHTML += html;

}


// =====================================
// 次へ
// =====================================

function nextQuestion(){

quizIndex++;

showQuiz();

}

</script>

</body>
</html>
