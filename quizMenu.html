<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>クイズメニュー</title>

<link rel="stylesheet" href="style.css">

<style>

body{
padding:10px;
background:#f5f5f5;
box-sizing:border-box;
}

.container{
width:100%;
max-width:500px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

button{
width:100%;
margin-top:15px;
padding:14px;
font-size:16px;
border:none;
border-radius:10px;
color:white;
cursor:pointer;
}

button:active{
transform:scale(0.98);
}

.title{
text-align:center;
margin-bottom:20px;
}

.sub{
margin-top:10px;
text-align:center;
color:#666;
font-size:14px;
}

.subjectBox{
margin-top:25px;
padding:15px;
border-radius:12px;
background:#f9f9f9;
}

.subjectTitle{
font-size:20px;
font-weight:bold;
margin-bottom:10px;
text-align:center;
}

.publicBtn{
background:#2196f3;
}

.sinkyuBtn{
background:#4caf50;
}

.homeBtn{
background:#777;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1 class="title">

📚 クイズ

</h1>

<p class="sub">

学習する科目を選択してください

</p>


<div class="subjectBox">

<div class="subjectTitle">

🏥 公衆衛生

</div>

<button
class="publicBtn"
onclick="startQuiz('public')"
>

公衆衛生クイズを始める

</button>

</div>


<div class="subjectBox">

<div class="subjectTitle">

🪡 総合鍼灸学

</div>

<button
class="sinkyuBtn"
onclick="startQuiz('sinkyu')"
>

総合鍼灸学クイズを始める

</button>

</div>


<button
class="homeBtn"
onclick="location.href='home.html'"
>

ホームへ戻る

</button>

</div>

</div>

<script>

function startQuiz(type){

localStorage.setItem(
"quizType",
type
);

location.href =
"quiz.html";

}

</script>

</body>
</html>
