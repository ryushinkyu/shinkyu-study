<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>講義</title>

<link rel="stylesheet" href="style.css">

<script src="lectureData.js"></script>

<style>

body{
background:#f5f5f5;
padding:10px;
box-sizing:border-box;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.title{
text-align:center;
margin-bottom:20px;
}

.menuButton{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
background:#2196f3;
color:white;
font-size:16px;
cursor:pointer;
}

.backButton{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:10px;
background:#777;
color:white;
font-size:16px;
cursor:pointer;
}

.lectureTitle{
font-size:24px;
font-weight:bold;
margin-bottom:20px;
text-align:center;
}

.lectureContent{
white-space:pre-wrap;
line-height:1.8;
background:#f9f9f9;
padding:20px;
border-radius:12px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1 class="title">

📖 講義

</h1>

<div id="app"></div>

</div>

</div>

<script>

const subject =
localStorage.getItem(
"lectureSubject"
);

function showMenu(){

let html = "";

for(let key in lectureData){

if(
subject === "public"
&&
!key.includes("総合鍼灸学")
){

html += `

<button
class="menuButton"
onclick="showLecture('${key}')"
>

${key}

</button>

`;

}

if(
subject === "sinkyu"
&&
key.includes("総合鍼灸学")
){

html += `

<button
class="menuButton"
onclick="showLecture('${key}')"
>

${key}

</button>

`;

}

}

html += `

<button
class="backButton"
onclick="location.href='lectureMenu.html'"
>

講義一覧へ戻る

</button>

`;

document.getElementById(
"app"
).innerHTML = html;

}

function showLecture(key){

const lecture =
lectureData[key];

let html = `

<div class="lectureTitle">

${lecture.title}

</div>

<div class="lectureContent">

${lecture.content}

</div>

<button
class="backButton"
onclick="showMenu()"
>

カテゴリへ戻る

</button>

`;

document.getElementById(
"app"
).innerHTML = html;

}

showMenu();

</script>

</body>
</html>
