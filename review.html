<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>復習リスト</title>
<link rel="stylesheet" href="style.css">

<style>

.mask{
background:#ffeb3b;
color:transparent;
padding:6px 12px;
border-radius:6px;
cursor:pointer;
display:inline-block;
user-select:none;
}

.show{
background:#e3f2fd;
color:#0288d1;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

  <div class="card">

    <h2>復習リスト</h2>

    <div id="reviewList"></div>

    <button onclick="location.href='home.html'">
      ホーム
    </button>

  </div>

</div>

<script>

let html = "";

// ===== 全科目チェック =====
for(let key in localStorage){

if(key.startsWith("wrongQuestions_")){

let subject = key.replace("wrongQuestions_","");
let wrong = JSON.parse(localStorage.getItem(key) || "[]");

if(wrong.length > 0){

html += `
<div class="card">

<h3>📚 ${subject}</h3>
`;

// ===== 問題表示 =====
wrong.forEach(w=>{

let q = w.questionData;

if(!q) return;

html += `

<div style="
margin-top:10px;
padding:10px;
background:#f9f9f9;
border-radius:8px;
">

<p>
<strong>${q.question}</strong>
</p>

<p style="
color:#0288d1;
font-weight:bold;
">

あなたの答え：
${q.choices[w.userAnswer]}

</p>

<p>

<strong>正解：</strong>

<span class="mask"
onclick="reveal(this)">

${q.choices[q.answer]}

</span>

</p>

</div>

`;

});

// ===== 復習ボタン =====
html += `

<button onclick="startReviewQuiz('${subject}')">

この科目を復習

</button>

`;

html += `</div>`;

}

}

}

// ===== 空 =====
if(html === ""){

html = `
<div class="card">
<p>復習する問題はありません</p>
</div>
`;

}

// ===== 表示 =====
document.getElementById("reviewList").innerHTML = html;

// ===== 正解表示 =====
function reveal(el){

el.classList.toggle("show");

}

// ===== 復習開始 =====
function startReviewQuiz(subject){

localStorage.setItem("selectedSubject", subject);

// reviewモード
localStorage.setItem("reviewMode", "true");

location.href = "quiz.html";

}

</script>

</body>
</html>
