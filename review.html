<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>復習リスト</title>

<link rel="stylesheet" href="style.css">

<style>

.mask{
background:#ffeb3b;
color:transparent;
padding:6px 12px;
border-radius:6px;
cursor:pointer;
display:inline-block;
user-select:none;
transition:0.2s;
}

.show{
background:#e3f2fd;
color:#0288d1;
font-weight:bold;
}

.reviewQuestion{
margin-top:15px;
padding:15px;
background:#f9f9f9;
border-radius:10px;
}

.correct{
background:#e3f2fd;
color:#0288d1;
}

.wrong{
background:#ffebee;
color:#f44336;
}

.resultText{
margin-top:10px;
font-weight:bold;
}

.choiceBtn{
margin-top:8px;
}

.chapterTitle{
margin-top:20px;
padding:10px;
background:#e3f2fd;
border-radius:8px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>復習リスト</h2>

<div id="reviewList"></div>

<button onclick="location.href='home.html'">
ホーム
</button>

</div>

</div>

<script>

let html = "";

// ===== 全科目 =====
for(let key in localStorage){

if(key.startsWith("wrongQuestions_")){

let subject = key.replace("wrongQuestions_","");
let wrong = JSON.parse(localStorage.getItem(key) || "[]");

if(wrong.length > 0){

html += `
<div class="card">

<h3>📚 ${subject}</h3>
`;

// ===== 章ごと整理 =====
let chapterMap = {};

wrong.forEach(w=>{

let chapter = w.questionData.chapter || "未分類";

if(!chapterMap[chapter]){

chapterMap[chapter] = [];

}

chapterMap[chapter].push(w);

});

// ===== 章ループ =====
for(let chapter in chapterMap){

html += `

<div class="chapterTitle">

📖 ${chapter}

</div>

`;

// ===== 問題 =====
chapterMap[chapter].forEach(w=>{

let q = w.questionData;

if(!q) return;

html += `

<div class="reviewQuestion">

<p>
<strong>
${q.question}
</strong>
</p>

<p style="
color:#0288d1;
font-weight:bold;
margin-top:10px;
">

あなたの答え：

${q.choices[w.userAnswer]}

</p>

<p style="margin-top:10px;">

<strong>正解：</strong>

<span class="mask"
onclick="reveal(this)">

${q.choices[q.answer]}

</span>

</p>

<div style="margin-top:15px;">

${q.choices.map((choice,i)=>`

<button class="choiceBtn" onclick="
checkAnswer(
this,
${i},
${q.answer},
'${subject}',
'${w.index}'
)
">

${i+1}．${choice}

</button>

`).join("")}

</div>

<div class="resultText"></div>

</div>

`;

});

}

html += `</div>`;

}

}

}

// ===== 空 =====
if(html === ""){

html = `
<div class="card">
<p>復習する問題はありません 👍</p>
</div>
`;

}

// ===== 表示 =====
document.getElementById("reviewList").innerHTML = html;

// ===== 正解表示 =====
function reveal(el){

el.classList.toggle("show");

}

// ===== 回答 =====
function checkAnswer(btn,choice,correct,subject,index){

// ===== 問題ブロック =====
const questionBox = btn.closest(".reviewQuestion");

// ===== 選択肢 =====
const buttons = questionBox.querySelectorAll(".choiceBtn");

// ===== 結果 =====
const resultText = questionBox.querySelector(".resultText");

// ===== ボタン停止 =====
buttons.forEach(b=>{

b.disabled = true;

});

// ===== 正解 =====
if(choice === correct){

btn.classList.add("correct");

resultText.innerHTML = "⭕ 正解！";
resultText.style.color = "#2196f3";

// ===== 復習から削除 =====
let wrong = JSON.parse(
localStorage.getItem("wrongQuestions_"+subject) || "[]"
);

// ===== index一致で削除 =====
wrong = wrong.filter(w => 
w.index != index
);

localStorage.setItem(
"wrongQuestions_"+subject,
JSON.stringify(wrong)
);

// ===== 少し後に更新 =====
setTimeout(()=>{

location.reload();

},800);

}

// ===== 不正解 =====
else{

btn.classList.add("wrong");

buttons[correct].classList.add("correct");

resultText.innerHTML = `
❌ 不正解<br>
正解：${buttons[correct].textContent}
`;

resultText.style.color = "#f44336";

}

}

</script>

</body>
</html>
