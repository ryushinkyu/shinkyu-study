<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>復習リスト</title>

<link rel="stylesheet" href="style.css">

<style>

.mask{
background:#ffeb3b;
color:transparent;
padding:6px 12px;
border-radius:6px;
cursor:pointer;
display:inline-block;
user-select:none;
transition:0.2s;
}

.show{
background:#e3f2fd;
color:#0288d1;
font-weight:bold;
}

.reviewQuestion{
margin-top:15px;
padding:15px;
background:#f9f9f9;
border-radius:10px;
}

.correct{
background:#e3f2fd;
color:#0288d1;
}

.wrong{
background:#ffebee;
color:#f44336;
}

</style>

</head>

<body>

<div class="container">

  <div class="card">

    <h2>復習リスト</h2>

    <div id="reviewList"></div>

    <button onclick="location.href='home.html'">
      ホーム
    </button>

  </div>

</div>

<script>

let html = "";

// ===== 全科目 =====
for(let key in localStorage){

if(key.startsWith("wrongQuestions_")){

let subject = key.replace("wrongQuestions_","");
let wrong = JSON.parse(localStorage.getItem(key) || "[]");

if(wrong.length > 0){

html += `
<div class="card">

<h3>📚 ${subject}</h3>
`;

// ===== 問題 =====
wrong.forEach((w,index)=>{

let q = w.questionData;

if(!q) return;

html += `

<div class="reviewQuestion">

<p>
<strong>${q.question}</strong>
</p>

<p style="
color:#0288d1;
font-weight:bold;
margin-top:10px;
">

あなたの答え：
${q.choices[w.userAnswer]}

</p>

<p style="margin-top:10px;">

<strong>正解：</strong>

<span class="mask"
onclick="reveal(this)">

${q.choices[q.answer]}

</span>

</p>

<div style="margin-top:15px;">

${q.choices.map((choice,i)=>`

<button onclick="
checkAnswer(
this,
${i},
${q.answer},
'${subject}',
${w.index}
)
">

${i+1}．${choice}

</button>

`).join("")}

</div>

</div>

`;

});

html += `</div>`;

}

}

}

// ===== 空 =====
if(html === ""){

html = `
<div class="card">
<p>復習する問題はありません 👍</p>
</div>
`;

}

// ===== 表示 =====
document.getElementById("reviewList").innerHTML = html;

// ===== 正解表示 =====
function reveal(el){

el.classList.toggle("show");

}

// ===== 回答 =====
function checkAnswer(btn,choice,correct,subject,index){

const parent = btn.parentElement;

const buttons = parent.querySelectorAll("button");

buttons.forEach(b=>{

b.disabled = true;

});

// ===== 正解 =====
if(choice === correct){

btn.classList.add("correct");

alert("⭕ 正解！");

// ===== 復習から削除 =====
let wrong = JSON.parse(
localStorage.getItem("wrongQuestions_"+subject) || "[]"
);

wrong = wrong.filter(w => w.index !== index);

localStorage.setItem(
"wrongQuestions_"+subject,
JSON.stringify(wrong)
);

setTimeout(()=>{

location.reload();

},500);

}

// ===== 不正解 =====
else{

btn.classList.add("wrong");

buttons[correct].classList.add("correct");

alert("❌ 不正解");

}

}

</script>

</body>
</html>
