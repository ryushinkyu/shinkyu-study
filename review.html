<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>復習リスト</title>

<link rel="stylesheet" href="style.css">

<style>

.reviewCard{
margin-top:15px;
padding:20px;
background:#f9f9f9;
border-radius:12px;
}

.chapterTitle{
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

.count{
margin-top:10px;
font-size:16px;
color:#666;
}

.empty{
text-align:center;
padding:30px;
font-size:18px;
}

.startBtn{
margin-top:15px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>

復習リスト

</h1>

<div id="reviewArea"></div>

<button
style="margin-top:20px;background:#777;"
onclick="location.href='home.html'"
>

ホーム

</button>

</div>

</div>

<script>

// ========================================
// 科目
// ========================================

const subject =
"衛生学・公衆衛生学";


// ========================================
// 復習取得
// ========================================

let wrongQuestions = JSON.parse(
localStorage.getItem(
"wrongQuestions_"+subject
) || "[]"
);


// ========================================
// 空
// ========================================

if(wrongQuestions.length === 0){

document.getElementById("reviewArea")
.innerHTML = `

<div class="empty">

復習する問題はありません 👍

</div>

`;

}


// ========================================
// 章ごと整理
// ========================================

else{

let grouped = {};

wrongQuestions.forEach(q=>{

const chapter =
q.chapter || "未分類";

if(!grouped[chapter]){

grouped[chapter] = [];

}

grouped[chapter].push(q);

});


// ========================================
// 表示
// ========================================

let html = "";

for(let chapter in grouped){

const count =
grouped[chapter].length;

html += `

<div class="reviewCard">

<div class="chapterTitle">

📚 ${chapter}

</div>

<div class="count">

間違えた問題：
${count}問

</div>

<button
class="startBtn"
onclick="startReview('${chapter}')"
>

復習する

</button>

</div>

`;

}

document.getElementById("reviewArea")
.innerHTML = html;

}


// ========================================
// 開始
// ========================================

function startReview(chapter){

localStorage.setItem(
"reviewMode",
"true"
);

localStorage.setItem(
"reviewChapter",
chapter
);

location.href = "quiz.html";

}

</script>

</body>
</html>
