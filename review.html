<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>復習リスト</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f5f5f5;
padding:10px;
box-sizing:border-box;
}

.container{
width:100%;
max-width:600px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:20px;
}

.reviewCard{
margin-top:15px;
padding:20px;
background:#ffffff;
border-radius:14px;
border-left:6px solid #2196f3;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.subject{
font-size:14px;
color:#666;
margin-bottom:8px;
}

.chapterTitle{
font-size:22px;
font-weight:bold;
margin-bottom:12px;
}

.count{
margin-top:10px;
font-size:16px;
color:#444;
}

.empty{
text-align:center;
padding:40px;
font-size:20px;
color:#666;
}

.startBtn{
margin-top:15px;
width:100%;
padding:14px;
font-size:16px;
border:none;
border-radius:10px;
background:#2196f3;
color:white;
cursor:pointer;
}

.startBtn:active{
transform:scale(0.98);
}

.homeBtn{
margin-top:20px;
background:#777;
width:100%;
padding:14px;
font-size:16px;
border:none;
border-radius:10px;
color:white;
cursor:pointer;
}

.totalBox{
margin-bottom:20px;
padding:15px;
background:#e3f2fd;
border-radius:12px;
text-align:center;
font-size:18px;
font-weight:bold;
color:#0d47a1;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>

📝 復習リスト

</h1>

<div id="reviewArea"></div>

<button
class="homeBtn"
onclick="location.href='home.html'"
>

ホームへ戻る

</button>

</div>

</div>

<script>

// ========================================
// 復習データ取得
// ========================================

let wrongQuestions = JSON.parse(
localStorage.getItem(
"wrongQuestions_衛生学・公衆衛生学"
) || "[]"
);


// ========================================
// 空チェック
// ========================================

if(wrongQuestions.length === 0){

document.getElementById(
"reviewArea"
).innerHTML = `

<div class="empty">

復習する問題はありません 👍

</div>

`;

}


// ========================================
// グループ化
// ========================================

else{

let grouped = {};

wrongQuestions.forEach(q=>{

const chapter =
q.chapter || "未分類";

if(!grouped[chapter]){

grouped[chapter] = [];

}

grouped[chapter].push(q);

});


// ========================================
// 合計
// ========================================

let total =
wrongQuestions.length;


// ========================================
// HTML
// ========================================

let html = `

<div class="totalBox">

合計：
${total}問の復習があります

</div>

`;


// ========================================
// カード生成
// ========================================

for(let chapter in grouped){

const count =
grouped[chapter].length;

html += `

<div class="reviewCard">

<div class="subject">

🏥 衛生学・公衆衛生学

</div>

<div class="chapterTitle">

📚 ${chapter}

</div>

<div class="count">

間違えた問題：
<strong>

${count}問

</strong>

</div>

<button
class="startBtn"
onclick="startReview('${chapter}')"
>

このカテゴリを復習する

</button>

</div>

`;

}

document.getElementById(
"reviewArea"
).innerHTML = html;

}


// ========================================
// 復習開始
// ========================================

function startReview(chapter){

localStorage.setItem(
"reviewMode",
"true"
);

localStorage.setItem(
"reviewChapter",
chapter
);

location.href =
"quiz.html";

}

</script>

</body>
</html>
