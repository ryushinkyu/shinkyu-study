<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>一問一答</title>

<link rel="stylesheet" href="style.css">

<style>

.correct{
background:#e3f2fd;
color:#01579b;
font-weight:bold;
border:2px solid #2196f3;
}

.wrong{
background:#ffebee;
color:#b71c1c;
font-weight:bold;
border:2px solid #f44336;
}

input{
width:100%;
padding:12px;
margin-top:15px;
font-size:16px;
box-sizing:border-box;
border-radius:8px;
border:1px solid #ccc;
}

.result{
margin-top:15px;
padding:20px;
border-radius:10px;
line-height:1.8;
font-size:18px;
}

.questionBox{
margin-top:20px;
padding:15px;
background:#f9f9f9;
border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2 id="title"></h2>

<div id="quizArea"></div>

<button
style="margin-top:20px;background:#777;"
onclick="location.href='oneQuestionMenu.html'"
>

戻る

</button>

</div>

</div>

<script>

// =====================================
// カテゴリ取得
// =====================================

const category =
localStorage.getItem(
"oneQuestionCategory"
);


// =====================================
// 問題データ
// =====================================

const data = {

"小児特有の症候":[

{
q:"小児科の対象を答えよ",
a:"0~15歳"
},

{
q:"発達曲線を提唱したものを答えよ",
a:"スキャモン"
},

{
q:"発熱の80から90％は何感染によるかぜか答えよ",
a:"ウイルス"
},

{
q:"発熱とかぜ症状を伴いコプリック斑が見られる疾患を答えよ",
a:"麻疹"
},

{
q:"高熱が3から4日続いた後に平熱になり発疹がでる疾患を答えよ",
a:"突発性発疹"
},

{
q:"扁桃炎は何を主症状とする感染症か答えよ",
a:"発熱・喉の痛み"
},

{
q:"A群溶血性連鎖球菌の別名を答えよ",
a:"溶連菌"
},

{
q:"腹痛の中で軽度の痛みの多くは便通異常ともう一つを答えよ",
a:"胃腸炎"
},

{
q:"発症から４週間未満の急性の咳はどのような疾患があるか答えよ",
a:"上気道感染・後鼻漏"
},

{
q:"発症から４週間以上続く慢性の咳はどのような疾患があるか答えよ",
a:"喘息・胃食道逆流症・後鼻漏"
},

{
q:"生後6か月から5歳頃に38°ｃ以上の発熱に伴って起こる原因不明の痙攣を答えよ",
a:"熱性痙攣"
},

{
q:"小児はりはどこの国独自の治療方法か答えよ",
a:"日本"
},

{
q:"小児はりに多い疾患を３つ答えよ",
a:"アトピー性皮膚炎、気管支喘息、夜尿症"
},

{
q:"小児はりは保護者に（　　）状態で施術する",
a:"抱かせた"
},

{
q:"小児は（　　）の体と呼ばれている",
a:"純陽"
}

],

"老年特有の症候":[

{
q:"何歳を超えたころから聴力が低下するのか答えよ",
a:"40歳"
},

{
q:"どの音域から聞こえにくくなるか答えよ",
a:"高音域"
},

{
q:"ロコモ度テストを2つ答えよ",
a:"立ち上がりテスト・2ステップテスト"
},

{
q:"サルコペニアとは加齢に伴う何の減少か答えよ",
a:"筋肉量"
},

{
q:"三大認知症疾患を2つ答えよ",
a:"アルツハイマー型認知症・レビー小体型認知症"
}

],

"気分障害":[

{
q:"うつ病は男女どちらに多いか答えよ",
a:"女性"
},

{
q:"我が国のうつ病患者は増加か減少しているか答えよ",
a:"増加"
},

{
q:"躁状態やうつ状態を繰り返す双極性障害。これらの総称を答えよ",
a:"気分障害"
},

{
q:"うつ病は神経伝達物質の何が不足しているか答えよ",
a:"セロトニン"
},

{
q:"不安障害で全般的で持続的な過剰の不安が特徴的なものを答えよ",
a:"全般性不安障害"
}

]

};


// =====================================
// 状態
// =====================================

let quiz = data[category];
let index = 0;


// =====================================
// 表示
// =====================================

function showQuiz(){

if(index >= quiz.length){

document.getElementById("quizArea")
.innerHTML = `

<h2>

終了！

</h2>

<p>

${quiz.length}問終了しました 👍

</p>

<button onclick="restart()">

もう一度

</button>

`;

return;

}

const q = quiz[index];

document.getElementById("title")
.innerText = category;

document.getElementById("quizArea")
.innerHTML = `

<div class="questionBox">

<h3>

問題 ${index+1}

</h3>

<p>

${q.q}

</p>

</div>

<input
type="text"
id="userAnswer"
placeholder="答えを入力"
>

<button onclick="checkAnswer()">

回答する

</button>

<div id="result"></div>

`;

}


// =====================================
// 判定
// =====================================

function checkAnswer(){

const q = quiz[index];

const userAnswer =
document.getElementById("userAnswer")
.value.trim();

const result =
document.getElementById("result");


// ===== 空 =====

if(!userAnswer){

alert("入力してください");
return;

}


// =====================================
// 判定用
// =====================================

const correct =
q.a
.replace(/\s/g,"")
.replace(/・/g,"")
.replace(/、/g,"")
.replace(/,/g,"")
.toLowerCase();

const input =
userAnswer
.replace(/\s/g,"")
.replace(/・/g,"")
.replace(/、/g,"")
.replace(/,/g,"")
.toLowerCase();


// =====================================
// 正解
// =====================================

if(correct.includes(input)){

result.innerHTML = `

<div class="result correct">

⭕ 正解！

<br><br>

<strong>

正解：

</strong>

${q.a}

</div>

<button onclick="nextQuestion()">

次へ

</button>

`;

}


// =====================================
// 不正解
// =====================================

else{

let wrong = JSON.parse(
localStorage.getItem(
"oneWrongQuestions"
) || "[]"
);

wrong.push({

category:category,
question:q.q,
correct:q.a,
user:userAnswer

});

localStorage.setItem(
"oneWrongQuestions",
JSON.stringify(wrong)
);

result.innerHTML = `

<div class="result wrong">

❌ 不正解

<br><br>

<strong>

あなたの答え：

</strong>

${userAnswer}

<br><br>

<strong>

正解：

</strong>

${q.a}

</div>

<button onclick="nextQuestion()">

次へ

</button>

`;

}

}


// =====================================
// 次へ
// =====================================

function nextQuestion(){

index++;

showQuiz();

}


// =====================================
// リスタート
// =====================================

function restart(){

index = 0;

showQuiz();

}


// =====================================

showQuiz();

</script>

</body>
</html>
