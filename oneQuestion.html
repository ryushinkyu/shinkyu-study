
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鍼灸Study - 公衆衛生学 一問一答</title>
<link rel="stylesheet" href="styli.css">

<style>
body {
  padding: 10px;
  background: #f5f5f5;
  box-sizing: border-box;
}
.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
}
button {
  width: 100%;
  margin-top: 15px;
  padding: 14px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: #2196f3;
  color: white;
  cursor: pointer;
}
input {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  font-size: 16px;
  box-sizing: border-box;
  border-radius: 8px;
  border: 1px solid #ccc;
}
.result {
  margin-top: 15px;
  padding: 20px;
  border-radius: 10px;
  line-height: 1.8;
  font-size: 17px;
}
.correct {
  background: #e3f2fd;
  color: #01579b;
  font-weight: bold;
  border: 2px solid #2196f3;
}
.wrong {
  background: #ffebee;
  color: #b71c1c;
  font-weight: bold;
  border: 2px solid #f44336;
}
.questionBox {
  margin-top: 20px;
  padding: 18px;
  background: #f9f9f9;
  border-radius: 10px;
  line-height: 1.8;
  font-size: 18px;
}
.title {
  text-align: center;
  margin-bottom: 20px;
}
.progress {
  margin-top: 10px;
  color: #666;
  font-size: 14px;
  text-align: center;
}
.score {
  margin-top: 20px;
  padding: 15px;
  background: #f1f8e9;
  border-radius: 10px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}
.number {
  font-size: 14px;
  color: #666;
  margin-bottom: 10px;
}
.small {
  font-size: 14px;
  color: #666;
  line-height: 1.7;
}
</style>
</head>

<body>
<div class="container">
  <div class="card">
    <h2 id="title" class="title">🏥 公衆衛生学 一問一答</h2>
    <div id="quizArea"></div>

    <button
      style="background:#777"
      onclick="location.href='oneQuestionMenu.html'">
      科目選択に戻る
    </button>
  </div>
</div>

<script>
const questions = [
  {
    no: "1",
    q: "公衆衛生の主な目的は何か。",
    a: ["集団の健康の保持・増進と疾病の予防"]
  },
  {
    no: "2",
    q: "公衆衛生は主に個人と集団のどちらを対象とするか。",
    a: ["集団"]
  },
  {
    no: "3",
    q: "世界保健機関をアルファベット3文字で何というか。",
    a: ["WHO"]
  },
  {
    no: "4",
    q: "WHOの日本語名称を答えよ。",
    a: ["世界保健機関"]
  },
  {
    no: "5",
    q: "1978年のアルマ・アタ宣言で重視された考え方は何か。",
    a: ["プライマリ・ヘルス・ケア", "PHC"]
  },
  {
    no: "6",
    q: "健康増進や疾病予防を通して、集団の健康を支える活動を何というか。",
    a: ["公衆衛生活動"]
  },
  {
    no: "7",
    q: "SDGsのゴールは全部でいくつあるか。",
    a: ["17", "17個", "17のゴール"]
  },
  {
    no: "8",
    q: "SDGsの目標3は何を目指しているか。",
    a: ["すべての人に健康と福祉を"]
  },
  {
    no: "9",
    q: "SDGsの目標5は何を目指しているか。",
    a: ["ジェンダー平等を実現しよう", "ジェンダー平等"]
  },
  {
    no: "10",
    q: "性と生殖に関する健康と権利を何というか。",
    a: [
      "リプロダクティブ・ヘルス／ライツ",
      "リプロダクティブヘルスライツ"
    ]
  },
  {
    no: "11",
    q: "以前から知られていた感染症が再び公衆衛生上の問題となるものを何というか。",
    a: ["再興感染症"]
  },
  {
    no: "12",
    q: "新たに認識された、または新たな公衆衛生上の問題となった感染症を何というか。",
    a: ["新興感染症"]
  },
  {
    no: "13",
    q: "JICAの日本語名称を答えよ。",
    a: ["国際協力機構"]
  },
  {
    no: "14",
    q: "保健所を設置する主体の例を1つ答えよ。",
    a: ["都道府県", "保健所政令市", "特別区"]
  },
  {
    no: "15",
    q: "地域住民に健康相談や保健指導などを行う市町村の施設を何というか。",
    a: ["市町村保健センター", "保健センター"]
  }
];

let index = 0;
let score = 0;
let answered = false;

const quizArea = document.getElementById("quizArea");

function normalize(text) {
  return String(text)
    .replace(/[\s・、。，,／/「」『』()（）\-‐‑–—]/g, "")
    .toLowerCase();
}

function showQuiz() {
  answered = false;

  if (index >= questions.length) {
    showResult();
    return;
  }

  const q = questions[index];

  quizArea.innerHTML = `
    <div class="progress">
      ${index + 1} / ${questions.length} 問
    </div>

    <div class="questionBox">
      <div class="number">問題 ${q.no}</div>
      <div>${q.q}</div>
    </div>

    <input
      type="text"
      id="userAnswer"
      placeholder="答えを入力"
      autocomplete="off">

    <button id="answerButton">回答する</button>
    <div id="result"></div>
  `;

  document.getElementById("answerButton")
    .addEventListener("click", checkAnswer);

  document.getElementById("userAnswer")
    .addEventListener("keydown", function(event) {
      if (event.key === "Enter") checkAnswer();
    });

  document.getElementById("userAnswer").focus();
}

function checkAnswer() {
  if (answered) return;

  const q = questions[index];
  const inputEl = document.getElementById("userAnswer");
  const userAnswer = inputEl.value.trim();

  if (!userAnswer) {
    alert("答えを入力してください");
    return;
  }

  answered = true;

  const correct = q.a.some(function(answer) {
    return normalize(answer) === normalize(userAnswer);
  });

  if (correct) score++;

  const result = document.getElementById("result");

  result.innerHTML = `
    <div class="result ${correct ? "correct" : "wrong"}">
      ${correct ? "⭕ 正解！" : "❌ 不正解"}
      <br><br>
      正解例：${q.a[0]}
      ${correct ? "" : "<br><br>入力した答え：" + escapeHtml(userAnswer)}
    </div>

    <p class="small">
      ※答えの表記によっては、意味が合っていても不正解になる場合があります。
    </p>

    <button id="nextButton">
      ${index + 1 === questions.length ? "結果を見る" : "次へ"}
    </button>
  `;

  document.getElementById("nextButton")
    .addEventListener("click", function() {
      index++;
      showQuiz();
    });
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

function showResult() {
  const percent = Math.round(score / questions.length * 100);

  quizArea.innerHTML = `
    <h2 style="text-align:center">一問一答終了！</h2>

    <div class="score">
      ${questions.length}問中 ${score}問正解！
      <br>
      正答率：${percent}%
    </div>

    <button id="retryButton">もう一度挑戦</button>
  `;

  document.getElementById("retryButton")
    .addEventListener("click", function() {
      index = 0;
      score = 0;
      showQuiz();
    });
}

showQuiz();
</script>
</body>
</html>
