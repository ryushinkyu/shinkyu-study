<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>一問一答</title>

<link rel="stylesheet" href="style.css">

<style>

body{
padding:10px;
box-sizing:border-box;
background:#f5f5f5;
}

.container{
width:100%;
max-width:500px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-sizing:border-box;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

button{
width:100%;
margin-top:15px;
font-size:16px;
padding:14px;
box-sizing:border-box;
border:none;
border-radius:10px;
background:#2196f3;
color:white;
cursor:pointer;
}

button:active{
transform:scale(0.98);
}

.correct{
background:#e3f2fd;
color:#01579b;
font-weight:bold;
border:2px solid #2196f3;
}

.wrong{
background:#ffebee;
color:#b71c1c;
font-weight:bold;
border:2px solid #f44336;
}

input{
width:100%;
max-width:100%;
padding:14px;
margin-top:15px;
font-size:16px;
box-sizing:border-box;
border-radius:8px;
border:1px solid #ccc;
}

.result{
margin-top:15px;
padding:20px;
border-radius:10px;
line-height:1.8;
font-size:18px;
}

.questionBox{
margin-top:20px;
padding:18px;
background:#f9f9f9;
border-radius:10px;
line-height:1.8;
font-size:18px;
}

.title{
text-align:center;
margin-bottom:20px;
}

.progress{
margin-top:10px;
color:#666;
font-size:14px;
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2
id="title"
class="title"
></h2>

<div id="quizArea"></div>

<button
style="margin-top:20px;background:#777;"
onclick="location.href='oneQuestionCategory.html'"
>

戻る

</button>

</div>

</div>

<script>

// =====================================
// カテゴリ取得
// =====================================

const category =
localStorage.getItem(
"oneQuestionCategory"
);


// =====================================
// データ
// =====================================

const data = {

"総合鍼灸学":[

{
q:"感覚性障害では上行性と下行性どちらが起こりやすいか答えよ",
a:"上行性"
},

{
q:"運動性障害では上行性と下行性どちらが起こりやすいか答えよ",
a:"下行性"
},

{
q:"体性感覚は大きく何感覚と何感覚に分けられるか答えよ",
a:"皮膚感覚・深部感覚"
},

{
q:"皮膚感覚の別名を答えよ",
a:"表在感覚"
},

{
q:"触覚、温度覚、痛覚は何感覚に分類されるか答えよ",
a:"皮膚感覚"
},

{
q:"振動覚、固有感覚、深部痛覚は何感覚に分類されるか答えよ",
a:"深部感覚"
},

{
q:"圧覚を受容する受容器を答えよ",
a:"メルケル盤"
},

{
q:"軽い触覚を受容する受容器を答えよ",
a:"ルフィニ終末"
},

{
q:"振動刺激で興奮しやすい受容器を答えよ",
a:"パチニ小体"
},

{
q:"冷覚は何線維で伝導されるか答えよ",
a:"Aδ線維とC線維"
},

{
q:"温覚は主に何線維で伝導されるか答えよ",
a:"C線維"
},

{
q:"速い痛みを伝える受容器を答えよ",
a:"機械的侵害受容器"
},

{
q:"遅い痛みを伝える受容器を答えよ",
a:"ポリモーダル受容器"
},

{
q:"振動覚の求心性線維を答えよ",
a:"Aβ線維"
},

{
q:"位置覚、運動覚、力覚をまとめて何覚というか答えよ",
a:"固有感覚"
},

{
q:"触圧覚の伝導路の名称を答えよ",
a:"後索-内側毛帯路"
},

{
q:"温度覚・痛覚の伝導路の名称を答えよ",
a:"脊髄視床路"
},

{
q:"後索-内側毛帯路で交叉する部位を答えよ",
a:"延髄"
},

{
q:"脊髄視床路で交叉する部位を答えよ",
a:"脊髄"
},

{
q:"一次求心性線維は何ニューロンか答えよ",
a:"一次ニューロン"
},

{
q:"二次求心性線維は何ニューロンか答えよ",
a:"二次ニューロン"
},

{
q:"三次求心性線維は何ニューロンか答えよ",
a:"三次ニューロン"
},

{
q:"体性感覚野は頭頂葉のどこに存在するか答えよ",
a:"中心後回"
},

{
q:"触覚には粗大触覚と何があるか答えよ",
a:"識別性触覚"
},

{
q:"冷覚は約何℃で最もよく感じるか答えよ",
a:"25℃"
},

{
q:"温覚は約何℃で最もよく感じるか答えよ",
a:"40℃"
},

{
q:"45℃以上では何覚になるか答えよ",
a:"痛覚"
},

{
q:"後索路で伝導される感覚を2つ答えよ",
a:"触圧覚・位置覚"
},

{
q:"脊髄視床路で伝導される感覚を2つ答えよ",
a:"温度覚・痛覚"
},

{
q:"一次体性感覚野はBrodmann何野か答えよ",
a:"1・2・3野"
},

{
q:"一次運動野はBrodmann何野か答えよ",
a:"4野"
},

{
q:"運動性のコヒトを何というか答えよ",
a:"ペンフィールドのホムンクルス"
},

{
q:"運動のタイミングや方向、強さを調節する部位を答えよ",
a:"小脳"
},

{
q:"小脳障害でみられる歩行を答えよ",
a:"酩酊歩行"
},

{
q:"運動の発現や円滑な運動の遂行に関与する部位を答えよ",
a:"大脳基底核"
},

{
q:"黒質は大脳基底核に含まれる。○か✕か",
a:"○"
},

{
q:"脳幹は中脳・橋・延髄からなる。○か✕か",
a:"○"
},

{
q:"錐体路の別名を答えよ",
a:"皮質脊髄路"
},

{
q:"錐体外路は錐体路以外の運動に関与する経路の総称である。○か✕か",
a:"○"
},

{
q:"痙縮は錐体路障害でみられる。○か✕か",
a:"○"
},

{
q:"固縮は錐体外路障害でみられる。○か✕か",
a:"○"
},

{
q:"鉛管現象や歯車現象は何でみられるか答えよ",
a:"固縮"
}

]

};


// =====================================
// カテゴリ存在チェック
// =====================================

if(!category || !data[category]){

document.getElementById(
"quizArea"
).innerHTML = `

<p>

カテゴリが見つかりません

</p>

`;

throw new Error("カテゴリなし");

}


// =====================================
// 状態
// =====================================

let quiz = data[category];
let index = 0;


// =====================================
// 表示
// =====================================

function showQuiz(){

if(index >= quiz.length){

document.getElementById(
"quizArea"
).innerHTML = `

<h2>

終了！

</h2>

<p>

${quiz.length}問終了しました 👍

</p>

<button onclick="restart()">

もう一度

</button>

`;

return;

}

const q = quiz[index];

document.getElementById(
"title"
).innerText = category;

document.getElementById(
"quizArea"
).innerHTML = `

<div class="progress">

${index+1} / ${quiz.length}

</div>

<div class="questionBox">

<p>

${q.q}

</p>

</div>

<input
type="text"
id="userAnswer"
placeholder="答えを入力"
>

<button onclick="checkAnswer()">

回答する

</button>

<div id="result"></div>

`;

}


// =====================================
// 判定
// =====================================

function checkAnswer(){

const q = quiz[index];

const userAnswer =
document.getElementById(
"userAnswer"
).value.trim();

const result =
document.getElementById(
"result"
);


// ===== 空 =====

if(!userAnswer){

alert("入力してください");
return;

}


// ===== 正規化 =====

const correct =
q.a
.replace(/\s/g,"")
.replace(/・/g,"")
.replace(/、/g,"")
.replace(/,/g,"")
.toLowerCase();

const input =
userAnswer
.replace(/\s/g,"")
.replace(/・/g,"")
.replace(/、/g,"")
.replace(/,/g,"")
.toLowerCase();


// ===== 完全一致 =====

if(correct === input){

result.innerHTML = `

<div class="result correct">

⭕ 正解！

<br><br>

<strong>

正解：

</strong>

${q.a}

</div>

<button onclick="nextQuestion()">

次へ

</button>

`;

}

else{

result.innerHTML = `

<div class="result wrong">

❌ 不正解

<br><br>

<strong>

あなたの答え：

</strong>

${userAnswer}

<br><br>

<strong>

正解：

</strong>

${q.a}

</div>

<button onclick="nextQuestion()">

次へ

</button>

`;

}

}


// =====================================
// 次へ
// =====================================

function nextQuestion(){

index++;

showQuiz();

}


// =====================================
// リスタート
// =====================================

function restart(){

index = 0;

showQuiz();

}


// =====================================

showQuiz();

</script>

</body>
</html>
