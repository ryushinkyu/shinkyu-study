<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>一問一答</title>

<link rel="stylesheet" href="style.css">

<style>

body{
padding:10px;
box-sizing:border-box;
background:#f5f5f5;
}

.container{
width:100%;
max-width:500px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-sizing:border-box;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

button{
width:100%;
margin-top:15px;
font-size:16px;
padding:14px;
box-sizing:border-box;
border:none;
border-radius:10px;
background:#2196f3;
color:white;
cursor:pointer;
}

button:active{
transform:scale(0.98);
}

.correct{
background:#e3f2fd;
color:#01579b;
font-weight:bold;
border:2px solid #2196f3;
}

.wrong{
background:#ffebee;
color:#b71c1c;
font-weight:bold;
border:2px solid #f44336;
}

input{
width:100%;
max-width:100%;
padding:14px;
margin-top:15px;
font-size:16px;
box-sizing:border-box;
border-radius:8px;
border:1px solid #ccc;
}

.result{
margin-top:15px;
padding:20px;
border-radius:10px;
line-height:1.8;
font-size:18px;
}

.questionBox{
margin-top:20px;
padding:18px;
background:#f9f9f9;
border-radius:10px;
line-height:1.8;
font-size:18px;
}

.title{
text-align:center;
margin-bottom:20px;
}

.progress{
margin-top:10px;
color:#666;
font-size:14px;
text-align:center;
}

.score{
margin-top:20px;
padding:15px;
background:#f1f8e9;
border-radius:10px;
text-align:center;
font-size:18px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2
id="title"
class="title"
></h2>

<div id="quizArea"></div>

<button
style="margin-top:20px;background:#777;"
onclick="location.href='oneQuestionCategory.html'"
>

戻る

</button>

</div>

</div>

<script>

const category =
localStorage.getItem(
"oneQuestionCategory"
);

const data = {

"総合鍼灸学①":[

{
q:"感覚性障害では上行性と下行性どちらが起こりやすいか答えよ",
a:"上行性"
},

{
q:"運動性障害では上行性と下行性どちらが起こりやすいか答えよ",
a:"下行性"
},

{
q:"体性感覚は大きく何感覚と何感覚に分けられるか答えよ",
a:"皮膚感覚・深部感覚"
},

{
q:"皮膚感覚の別名を答えよ",
a:"表在感覚"
},

{
q:"触覚、温度覚、痛覚は何感覚に分類されるか答えよ",
a:"皮膚感覚"
},

{
q:"触覚の受容器を全て記せ",
a:"ルフィニ終末・メルケル盤・マイスネル小体・毛包受容器・パチニ小体・ピンネス小体"
},

{
q:"機械的侵害受容器が連結する一次ニューロンの名称を答えよ",
a:"Aδ線維"
},

{
q:"触覚と振動覚の両方の刺激を受容できる受容器の名称を答えよ",
a:"パチニ小体"
}

],

"総合鍼灸学②":[

{
q:"振動覚、固有感覚、深部痛覚は何感覚に分類されるか答えよ",
a:"深部感覚"
},

{
q:"圧覚を受容する受容器を答えよ",
a:"メルケル盤"
},

{
q:"軽い触覚を受容する受容器を答えよ",
a:"ルフィニ終末"
},

{
q:"振動刺激で興奮しやすい受容器を答えよ",
a:"パチニ小体"
},

{
q:"冷覚は何線維で伝導されるか答えよ",
a:"Aδ線維とC線維"
},

{
q:"温覚は主に何線維で伝導されるか答えよ",
a:"C線維"
},

{
q:"速い痛みを伝える受容器を答えよ",
a:"機械的侵害受容器"
},

{
q:"遅い痛みを伝える受容器を答えよ",
a:"ポリモーダル受容器"
}

],

"総合鍼灸学③":[

{
q:"振動覚の求心性線維を答えよ",
a:"Aβ線維"
},

{
q:"位置覚、運動覚、力覚をまとめて何覚というか答えよ",
a:"固有感覚"
},

{
q:"触圧覚の伝導路が対側に移行する場所はどこか答えよ",
a:"延髄"
},

{
q:"Aβ線維が連絡する上行路の名称を答えよ",
a:"後索-内側毛帯路"
},

{
q:"痛覚は脊髄のどの場所を上行するか答えよ",
a:"脊髄視床路"
},

{
q:"温覚や冷覚の情報を伝える一次ニューロンの名称をそれぞれ答えよ",
a:"Aδ線維・C線維"
},

{
q:"折りたたみナイフ現象はどのような障害で出現するか答えよ",
a:"錐体路障害"
},

{
q:"錐体路の別名を答えよ",
a:"皮質脊髄路"
}

]

};

if(!category || !data[category]){

document.getElementById(
"quizArea"
).innerHTML = `

<p>

カテゴリが見つかりません

</p>

`;

throw new Error("カテゴリなし");

}

let quiz = data[category];
let index = 0;
let score = 0;

function showQuiz(){

if(index >= quiz.length){

document.getElementById(
"quizArea"
).innerHTML = `

<h2>

終了！

</h2>

<div class="score">

${quiz.length}問中
${score}問正解！

</div>

<button onclick="restart()">

もう一度

</button>

`;

return;

}

const q = quiz[index];

document.getElementById(
"title"
).innerText = category;

document.getElementById(
"quizArea"
).innerHTML = `

<div class="progress">

${index+1} / ${quiz.length}

</div>

<div class="questionBox">

<p>

${q.q}

</p>

</div>

<input
type="text"
id="userAnswer"
placeholder="答えを入力"
>

<button onclick="checkAnswer()">

回答する

</button>

<div id="result"></div>

`;

}

function checkAnswer(){

const q = quiz[index];

const userAnswer =
document.getElementById(
"userAnswer"
).value.trim();

const result =
document.getElementById(
"result"
);

if(!userAnswer){

alert("入力してください");
return;

}

const correct =
q.a
.replace(/\s/g,"")
.replace(/・/g,"")
.replace(/、/g,"")
.replace(/,/g,"")
.toLowerCase();

const input =
userAnswer
.replace(/\s/g,"")
.replace(/・/g,"")
.replace(/、/g,"")
.replace(/,/g,"")
.toLowerCase();

if(correct === input){

score++;

result.innerHTML = `

<div class="result correct">

⭕ 正解！

<br><br>

正解：
${q.a}

</div>

<button onclick="nextQuestion()">

次へ

</button>

`;

}

else{

result.innerHTML = `

<div class="result wrong">

❌ 不正解

<br><br>

あなたの答え：
${userAnswer}

<br><br>

正解：
${q.a}

</div>

<button onclick="nextQuestion()">

次へ

</button>

`;

}

}

function nextQuestion(){

index++;

showQuiz();

}

function restart(){

index = 0;
score = 0;

showQuiz();

}

showQuiz();

</script>

</body>
</html>
