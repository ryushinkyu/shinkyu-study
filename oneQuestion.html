<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>一問一答</title>

<link rel="stylesheet" href="style.css">

<style>

body{
padding:10px;
box-sizing:border-box;
background:#f5f5f5;
}

.container{
width:100%;
max-width:500px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

button{
width:100%;
margin-top:15px;
font-size:16px;
padding:14px;
border:none;
border-radius:10px;
background:#2196f3;
color:white;
cursor:pointer;
}

.correct{
background:#e3f2fd;
color:#01579b;
font-weight:bold;
border:2px solid #2196f3;
}

.wrong{
background:#ffebee;
color:#b71c1c;
font-weight:bold;
border:2px solid #f44336;
}

input{
width:100%;
padding:14px;
margin-top:15px;
font-size:16px;
box-sizing:border-box;
border-radius:8px;
border:1px solid #ccc;
}

.result{
margin-top:15px;
padding:20px;
border-radius:10px;
line-height:1.8;
font-size:18px;
}

.questionBox{
margin-top:20px;
padding:18px;
background:#f9f9f9;
border-radius:10px;
line-height:1.8;
font-size:18px;
}

.title{
text-align:center;
margin-bottom:20px;
}

.progress{
margin-top:10px;
color:#666;
font-size:14px;
text-align:center;
}

.score{
margin-top:20px;
padding:15px;
background:#f1f8e9;
border-radius:10px;
text-align:center;
font-size:18px;
font-weight:bold;
}

.number{
font-size:14px;
color:#666;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2 id="title" class="title"></h2>

<div id="quizArea"></div>

<button
style="background:#777;"
onclick="location.href='oneQuestionCategory.html'"
>

戻る

</button>

</div>

</div>

<script>

const category =
localStorage.getItem(
"oneQuestionCategory"
);

const data = {

"第一回":[

{
no:"1-1",
q:"感覚性障害では上行性と下行性どちらが起こりやすいか答えよ",
a:"上行性"
},

{
no:"1-2",
q:"運動性障害では上行性と下行性どちらが起こりやすいか答えよ",
a:"下行性"
},

{
no:"1-3",
q:"体性感覚は大きく何感覚と何感覚に分けられるか答えよ",
a:"皮膚感覚・深部感覚"
},

{
no:"1-4",
q:"皮膚感覚の別名を答えよ",
a:"表在感覚"
},

{
no:"1-5",
q:"触覚、温度覚、痛覚は何感覚に分類されるか答えよ",
a:"皮膚感覚"
},

{
no:"1-6",
q:"触覚の受容器を全て記せ",
a:"ルフィニ終末・メルケル盤・マイスネル小体・毛包受容器・パチニ小体・ピンネス小体"
},

{
no:"1-7",
q:"機械的侵害受容器が連結する一次ニューロンの名称を答えよ",
a:"Aδ線維"
},

{
no:"1-8",
q:"触覚と振動覚の両方の刺激を受容できる受容器の名称を答えよ",
a:"パチニ小体"
}

],

"第二回":[

{
no:"2-1",
q:"位置覚は体のどの部位の障害で異常がみられるか答えよ",
a:"脊髄後索"
},

{
no:"2-2",
q:"振動覚は体のどの部位の障害で異常がみられるか答えよ",
a:"脊髄後索"
},

{
no:"2-3",
q:"複合感覚は体のどの部位の障害で異常がみられるか答えよ",
a:"頭頂葉"
},

{
no:"2-4",
q:"痛覚検査で使用するものを答えよ",
a:"安全ピン"
},

{
no:"2-5",
q:"温度覚検査では温水は何℃程度か答えよ",
a:"40〜45℃"
},

{
no:"2-6",
q:"冷覚検査では冷水は何℃程度か答えよ",
a:"5〜10℃"
},

{
no:"2-7",
q:"二点識別覚とは何か答えよ",
a:"2点の刺激を2点として識別する能力"
},

{
no:"2-8",
q:"立体認知ができない状態を何というか答えよ",
a:"立体失認"
}

],

"第三回":[

{
no:"3-1",
q:"ブラウンセカール症候群とは何か答えよ",
a:"脊髄半側障害"
},

{
no:"3-2",
q:"病的反射はどの障害で出現するか答えよ",
a:"錐体路障害"
},

{
no:"3-3",
q:"折りたたみナイフ現象はどの障害で出現するか答えよ",
a:"錐体路障害"
},

{
no:"3-4",
q:"歯車様現象はどの障害で出現するか答えよ",
a:"錐体外路障害"
},

{
no:"3-5",
q:"鉛管現象はどの障害で出現するか答えよ",
a:"錐体外路障害"
},

{
no:"3-6",
q:"錐体路の別名を答えよ",
a:"皮質脊髄路"
},

{
no:"3-7",
q:"振動覚の求心性線維を答えよ",
a:"Aβ線維"
},

{
no:"3-8",
q:"位置覚、運動覚、力覚をまとめて何覚というか答えよ",
a:"固有感覚"
}

],

"第四回":[

],

"第五回":[

],

"第六回":[

],

"第七回":[

]

};

if(!category || !data[category]){

document.getElementById(
"quizArea"
).innerHTML = `

<p>

カテゴリが見つかりません

</p>

`;

throw new Error("カテゴリなし");

}

let quiz = data[category];
let index = 0;
let score = 0;

function showQuiz(){

if(quiz.length === 0){

document.getElementById(
"title"
).innerText = category;

document.getElementById(
"quizArea"
).innerHTML = `

<p style="text-align:center;margin-top:30px;">

まだ問題がありません

</p>

`;

return;

}

if(index >= quiz.length){

document.getElementById(
"quizArea"
).innerHTML = `

<h2>

終了！

</h2>

<div class="score">

${quiz.length}問中
${score}問正解！

</div>

<button onclick="restart()">

もう一度

</button>

`;

return;

}

const q = quiz[index];

document.getElementById(
"title"
).innerText = category;

document.getElementById(
"quizArea"
).innerHTML = `

<div class="progress">

${index+1} / ${quiz.length}

</div>

<div class="questionBox">

<div class="number">

問題 ${q.no}

</div>

<p>

${q.q}

</p>

</div>

<input
type="text"
id="userAnswer"
placeholder="答えを入力"
>

<button onclick="checkAnswer()">

回答する

</button>

<div id="result"></div>

`;

}

function normalize(text){

return text
.replace(/\s/g,"")
.replace(/・/g,"")
.replace(/、/g,"")
.replace(/,/g,"")
.toLowerCase();

}

function checkAnswer(){

const q = quiz[index];

const userAnswer =
document.getElementById(
"userAnswer"
).value.trim();

const result =
document.getElementById(
"result"
);

if(!userAnswer){

alert("入力してください");
return;

}

const correct =
normalize(q.a);

const input =
normalize(userAnswer);

if(correct === input){

score++;

result.innerHTML = `

<div class="result correct">

⭕ 正解！

<br><br>

正解：
${q.a}

</div>

<button onclick="nextQuestion()">

次へ

</button>

`;

}

else{

result.innerHTML = `

<div class="result wrong">

❌ 不正解

<br><br>

あなたの答え：
${userAnswer}

<br><br>

正解：
${q.a}

</div>

<button onclick="nextQuestion()">

次へ

</button>

`;

}

}

function nextQuestion(){

index++;

showQuiz();

}

function restart(){

index = 0;
score = 0;

showQuiz();

}

showQuiz();

</script>

</body>
</html>
